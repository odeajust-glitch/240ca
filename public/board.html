// Reads the open form; keeps the held time, file # and button current.
function wireGrievance(form, turn) {
  const G = window.Grievance;
  const f = form.elements;
  const val = (n) => f[n].value.trim();
  const read = () => {
    const prevOn = G.parseParts(val('prevOnDate'), val('prevOnTime'));
    return {
      name: val('name'), pin: val('pin'), gender: form.querySelector('input[name="gender"]:checked').value,
      prevAssign: val('prevAssign').toUpperCase(), nextAssign: val('nextAssign').toUpperCase(),
      engineer: val('engineer') || null, prevOn,
      prevOff: G.parseParts(val('prevOffDate'), val('prevOffTime')),
      nextOn: G.parseParts(val('nextOnDate'), val('nextOnTime')),
      fileNum: G.fileNumber(prevOn, val('initials'), f.letter.value),
    };
  };
  const btn = form.querySelector('button.gen');
  const errEl = form.querySelector('.gerr');
  function update() {
    const d = read();
    const hrs = d.prevOff && d.nextOn ? G.hoursBetween(d.prevOff, d.nextOn) : null;
    let err = '';
    if (d.prevOn && d.prevOff && G.hoursBetween(d.prevOn, d.prevOff) <= 0) err = 'Off duty is before on duty.';
    else if (hrs != null && hrs <= 0) err = 'The trip home is before off duty.';
    else if (hrs != null && !G.grievable(hrs)) err = 'Under 14 hours: no grievance.';
    errEl.textContent = err;
    form.querySelector('.g-held').textContent = hrs != null && hrs > 0 ? G.durationLabel(hrs) : '—';
    form.querySelector('.g-file').textContent = d.fileNum;
    btn.disabled = !(d.name && d.pin && val('initials') && d.prevAssign && d.nextAssign && d.prevOn && hrs != null && !err);
    return d;
  }
  form.addEventListener('input', (e) => {
    const t = e.target;
    if (t.name === 'name') {
      f.initials.value = G.extractInitials(t.value);
      // Someone this device has written for before: their PIN and Mr./Ms.
      const known = people().byName[t.value.trim().toUpperCase()];
      if (known) {
        if (known.pin) f.pin.value = known.pin;
        if (known.initials) f.initials.value = known.initials;
        form.querySelector(`input[name="gender"][value="${known.gender === 'female' ? 'female' : 'male'}"]`).checked = true;
      }
    }
    if (/Time$/.test(t.name)) {
      let x = t.value.replace(/\D/g, '');
      if (x.length > 2) x = `${x.slice(0, 2)}:${x.slice(2, 4)}`;
      t.value = x;
    }
    if (/Assign$|^initials$/.test(t.name)) t.value = t.value.toUpperCase();
    update();
  });
  form.addEventListener('change', update);
  btn.onclick = async () => {
    const d = update();
    btn.disabled = true;
    btn.textContent = 'Generating…';
    try {
      const res = await fetch('grievance_template.odt');
      if (!res.ok) throw new Error(`the letter template didn't load (HTTP ${res.status})`);
      const bytes = await G.buildOdt(window.JSZip, await res.arrayBuffer(), d, new Date());
      remember(turn, d, val('initials'));
      const url = URL.createObjectURL(new Blob([bytes], { type: 'application/vnd.oasis.opendocument.text' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: G.odtFilename(d.name, d.nextOn) });
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 8000);
    } catch (e) {
      errEl.textContent = `Couldn't make the letter: ${e.message}.`;
    } finally {
      btn.textContent = 'Generate grievance (.odt)';
      update();
    }
  };
  update();
}

async function source() {
  try {
    const index = await getJSON('data/index.json');
    const cache = new Map();
    return {
      live: true, index,
      days: index.days.map((d) => d.day),
      load: (day) => cache.get(day) || cache.set(day, getJSON(`data/${day}.json`).then((d) => d.snapshots)).get(day),
      turns: once(() => getJSON('data/turns.json').then((d) => d.turns)),
      trains: once(() => getJSON('data/trains.json').then((d) => d.trains)),
      names: once(() => getJSON('data/names.json').catch(() => null)),
      // Analytics (owner, 2026-10-26): runarounds and jobs going spare, and
      // the long-term archive. Either may be missing on an older build.
      analytics: once(() => getJSON('data/analytics.json').catch(() => null)),
      archive: once(() => getJSON('data/archive.json').catch(() => null)),
    };
  } catch {
    const data = await getJSON('board-sample.json');
    let prev = null;
    const byDay = new Map();
    for (const s of data.snapshots) {
      const snap = { ...s, prevTaken: prev && prev.taken };
      prev = s;
      const day = s.taken.slice(0, 10);
      if (!byDay.has(day)) byDay.set(day, []);
      byDay.get(day).push(snap);
    }
    return { live: false, days: [...byDay.keys()].reverse(), load: async (day) => byDay.get(day) || [],
      turns: once(async () => BoardTurns.finish(BoardTurns.history(data.snapshots))),
      trains: once(async () => BoardTrains.summarize(BoardTrains.track(data.snapshots))), names: async () => null,
      analytics: async () => null, archive: async () => null };
  }
}

source().then(async (src) => {
  if (!src.days.length) {
    document.getElementById('view').innerHTML = '<p class="empty">No snapshots yet. They appear here after the board checker\'s next check.</p>';
    return;
  }
  document.getElementById('sample').hidden = src.live;
  const showUpdated = (idx) => {
    if (!src.live || !idx.generatedAt) return;
    const u = document.getElementById('updated');
    u.hidden = false;
    u.textContent = 'Updated ' + new Date(idx.generatedAt).toLocaleString('en-CA', { timeZone: 'America/Toronto', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    // The board checker's own health (owner, 2026-10-22).
    const st = idx.status;
    let line = document.getElementById('checkerstatus');
    if (st && !line) { line = document.createElement('div'); line.id = 'checkerstatus'; line.className = 'status-line'; u.after(line); }
    if (st && line) {
      const ago = (ms) => { const m = Math.max(0, Math.round((Date.now() - ms) / 60000)); return m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')} m ago`; };
      line.textContent = [st.lastSignInAt ? `Microsoft sign-in ${ago(st.lastSignInAt)}` : null,
        st.restartsToday != null ? `${st.restartsToday} automatic restart${st.restartsToday === 1 ? '' : 's'} today` : null].filter(Boolean).join(' · ');
    }
  };
  showUpdated(src.index);
  const daySel = document.getElementById('day');
  daySel.innerHTML = src.days.map((d) => `<option value="${d}">${esc(when(d + ' 0000').day)}</option>`).join('');

  let list = [];
  let day = null;
  let cur = 0;
  // Which tab is showing: 'current' (the landing), 'snap', 'orders', 'held'.
  let mode = 'current';
  // Set when the site has published a newer board since this page loaded.
  let newerBar = '';
  let poolTab = 0;

  async function openDay(d, pick) {
    day = d;
    daySel.value = d;
    list = await src.load(d);
    document.getElementById('rail').innerHTML = list.map((s, i) => [s, i]).reverse().map(([s, i]) => {
      const w = when(s.taken);
      const same = s.sameUntil ? `<span class="same">same until ${esc(when(s.sameUntil).time)}</span>` : '';
      return `<li><button data-i="${i}"><span class="d">${esc(w.day)}</span><span class="t">${esc(w.time)}</span><span class="n">${s.lineup.length} trains</span>${same}</button></li>`;
    }).join('');
    const i = typeof pick === 'string' ? list.findIndex((s) => s.taken === pick) : pick;
    show(i >= 0 && i < list.length ? i : list.length - 1);
  }

  // Earlier/Later run across days.
  async function step(dir) {
    if (list[cur + dir]) return show(cur + dir);
    const di = src.days.indexOf(day) - dir; // days are newest first
    if (di < 0 || di >= src.days.length) return;
    const next = await src.load(src.days[di]);
    openDay(src.days[di], dir < 0 ? next.length - 1 : 0);
  }

  const clean = (t) => String(t || '').trim().toUpperCase().replace(/\s+/g, '');
  // Tracked turns (owner, 2026-10-24): looked up with Find a turn on Current
  // or Snapshots, picked out on the page, alerts as chosen. Kept on this
  // phone; turns with alerts on are tracked too.
  const TRACK_KEY = 'trackTurns';
  const tracked = () => {
    let mine = [];
    try { mine = JSON.parse(localStorage.getItem(TRACK_KEY)) || []; } catch (e) { /* storage off */ }
    return [...new Set([...mine, ...Alerts.turns()])];
  };
  const keepTracked = (l) => { try { localStorage.setItem(TRACK_KEY, JSON.stringify(l)); } catch (e) { /* not kept */ } };
  // Following a person (owner, 2026-10-25: "alerts follow the person, or the
  // turn, whatever they choose"): kept as '@' + the hash of their code; the
  // code itself (e.g. JUOD, never a name) only on this phone, for the label.
  // personNow: the turn each followed person is on now (data/people.json).
  const isPerson = (t) => /^@[0-9a-f]{16}$/.test(t || '');
  const CODES_KEY = 'personCodes';
  const codes = () => { try { return JSON.parse(localStorage.getItem(CODES_KEY)) || {}; } catch (e) { return {}; } };
  const keepCode = (h, code) => { try { localStorage.setItem(CODES_KEY, JSON.stringify({ ...codes(), [h]: code })); } catch (e) { /* not kept */ } };
  const personNow = {};
  const personCands = {}; // a followed code matching more than one turn now: those turns
  const nowTurn = (t) => (isPerson(t) ? personNow[t] || '' : BoardTurns.splitCraft(t).base);
  const label = (t) => (isPerson(t) ? `👤 ${codes()[t] || 'person'}${personNow[t] ? ` (${personNow[t]})` : ''}` : t.replace(/-(EN|CO)$/, ' $1'));
  async function refreshPersons() {
    let changed = false;
    for (const t of tracked().filter(isPerson)) {
      const list = await Person.byHash(t);
      const cur = list && Person.current(list, Person.pickOf(t));
      const turn = cur ? cur.turn : '';
      const cands = list ? Person.candidates(list) : [];
      if (personNow[t] !== turn || String(personCands[t]) !== String(cands)) { personNow[t] = turn; personCands[t] = cands; changed = true; }
    }
    return changed;
  }
  const trackChips = (lbl) => {
    const t = tracked();
    return t.length ? `<span class="lbl">${lbl}</span>${t.map((x) => `<button type="button" data-track="${esc(x)}">${esc(label(x))}${Alerts.state(x) === 'on' ? ' 🔔' : ''}</button>`).join('')}` : '';
  };
  // Under the chips (owner, 2026-10-24): each tracked turn in a line or two,
  // from the snapshot showing: where it stands and what it's lined up for,
  // plus the newest "when it goes" answer when there is one.
  let summaryFor = null; // the snapshot the summary was drawn from
  const LINED = new Set(['lineup', 'spareFill', 'homeTrain', 'onDuty', 'mayCall', 'sequence']);
  function trackSummary(s) {
    const t = tracked();
    if (!s || !t.length) return '';
    const rows = t.map((entry) => {
      const turn = nowTurn(entry);
      if (!turn) return `<li><b class="num">${esc(label(entry))}</b><div class="muted">Not seen on a turn in the saved checks yet.</div></li>`;
      const f = BoardTurns.facts(s, turn);
      const where = f.filter((x) => !LINED.has(x.kind)).map((x) => x.text);
      const lined = f.filter((x) => LINED.has(x.kind) && !(x.kind === 'homeTrain' && !x.train && /^No train/.test(x.text)))
        .map((x) => ({ kind: x.kind, text: x.text.replace(/^Projected for /, 'Lined up for ').replace(/^Projected to fill /, 'Lined up for ') }));
      const lines = [...where.map((text) => ({ kind: 'status', text })), ...lined];
      const cands = isPerson(entry) ? personCands[entry] || [] : [];
      const pick = cands.length > 1 ? `<div class="pickturn">${esc(codes()[entry] || 'This code')} matches more than one turn right now. Which is yours? ${cands.map((c) => `<button type="button" data-pick="${esc(entry)}|${esc(c)}" aria-pressed="${c === turn}">${esc(c)}</button>`).join('')}</div>` : '';
      return `<li data-sum="${esc(turn)}"><b class="num">${esc(isPerson(entry) ? label(entry) : turn)}</b> <span class="go"></span>${pick}${lines.length ? lines.map((l) => `<div data-kind="${l.kind}">${esc(l.text)}</div>`).join('') : '<div class="muted">Not on any screen in this check.</div>'}</li>`;
    }).join('');
    return `<ul class="tsum">${rows}</ul>`;
  }
  // Redraw what shows the tracked turns: the board (once a check is loaded),
  // else just the list.
  function redrawTracked() {
    setMarks();
    if ((mode === 'current' || mode === 'snap') && list[cur]) show(cur, true);
    else paintTracked();
  }
  function paintTracked(s = summaryFor) {
    summaryFor = s;
    const box = document.getElementById('tracked');
    box.innerHTML = trackChips('Tracking (tap to change):') + trackSummary(s);
    box.querySelectorAll('[data-track]').forEach((b) => { b.onclick = () => openTrack(b.dataset.track); });
    box.querySelectorAll('[data-pick]').forEach((b) => {
      b.onclick = () => { const [who, turn] = b.dataset.pick.split('|'); Person.setPick(who, turn); refreshPersons().then(redrawTracked); };
    });
    // Followed people: find their turn now, then draw again if it changed.
    // Their turn arrives after the first paints (owner, 2026-10-26: sometimes
    // "Not seen on a turn" stayed up): redraw whatever is showing by then.
    if (tracked().some(isPerson)) refreshPersons().then((ch) => { if (ch) redrawTracked(); });
    // The newest check's "when it goes", for the current board only.
    if (!s || !src.live || s.taken !== src.index.latest) return;
    whenGo().then((w) => {
      if (!w || summaryFor !== s) return;
      box.querySelectorAll('li[data-sum]').forEach((li) => {
        const lines = w.turns && w.turns[li.dataset.sum];
        const go = li.querySelector('.go');
        if (!lines || !go) return;
        go.textContent = lines[0];
        // The answer already names the train it's lined up for.
        li.querySelectorAll('div[data-kind="lineup"]').forEach((d) => d.remove());
      });
    });
  }
  // Which turns the page picks out: Turn History's own turn there, the
  // tracked ones everywhere else.
  const setMarks = () => { marks = mode === 'turns' ? (focus ? [BoardTurns.splitCraft(focus).base] : []) : tracked().map(nowTurn).filter(Boolean); };

  // The box under "Find a turn" on Current/Snapshots: the turn's alert
  // choices, OK to track it (and get its alerts), Cancel, or stop tracking.
  const dlg = document.getElementById('trackdlg');
  const TIMES = [[0, 'never'], [15, '15 min'], [30, '30 min'], [60, '1 h'], [90, '1½ h'], [120, '2 h'], [180, '3 h']];
  // A reminder before the expected call (owner, 2026-10-25), e.g. for yard
  // jobs that never show ordered.
  const BEFORE = [[0, 'never'], [90, '90 min'], [60, '60 min'], [45, '45 min'], [30, '30 min']];
  function noPlaceholder(turn) {
    dlg.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><header><h2>${esc(turn)}</h2></header>
      <div class="alertnote">${esc(turn)} is a placeholder (make-up) turn, so it can't be searched or tracked. Look up the person's own turn, or their name code, instead.</div>
      <div class="btns"><button type="button" class="ok" id="dlgcancel">OK</button></div></div>`;
    dlg.dataset.turn = '';
    dlg.hidden = false;
    document.getElementById('dlgcancel').onclick = () => { dlg.hidden = true; dlg.innerHTML = ''; };
  }
  // "Conductor or engineer?" for a turn number shared by two turns; then
  // carries on with e.g. "S501-CO".
  function askCraft(turn, then) {
    dlg.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><header><h2>${esc(turn)}</h2></header>
      <div class="alertnote">${esc(turn)} is two turns with one number. Which one?</div>
      <div class="btns"><button type="button" class="ok" data-craft="CO">Conductor</button><button type="button" class="ok" data-craft="EN">Engineer</button><button type="button" id="dlgcancel">Cancel</button></div></div>`;
    dlg.dataset.turn = '';
    dlg.hidden = false;
    document.getElementById('dlgcancel').onclick = () => { dlg.hidden = true; dlg.innerHTML = ''; };
    dlg.querySelectorAll('[data-craft]').forEach((b) => { b.onclick = () => { dlg.hidden = true; dlg.innerHTML = ''; then(`${turn}-${b.dataset.craft}`); }; });
  }
  function openTrack(turnIn) {
    const turn = isPerson(turnIn) ? turnIn : clean(turnIn);
    if (!(isPerson(turn) || /^[A-Z0-9]{2,6}(-(EN|CO))?$/.test(turn)) || (!dlg.hidden && dlg.dataset.turn === turn)) return;
    // MU turns are placeholders: not tracked (owner, 2026-10-25).
    if (BoardTurns.PLACEHOLDER.test(turn)) return noPlaceholder(turn);
    // One number, two turns (S501 EN / CO): ask which first (owner, 2026-10-25).
    if (BoardTurns.SHARED.test(turn)) return askCraft(turn, openTrack);
    dlg.dataset.turn = turn;
    const was = tracked().includes(turn);
    // Boards that skip someone on rest: the Chain Gang (SR/SD) and the
    // spareboards (owner, 2026-10-25); not A/B, S1/S3 or 501/502. A person
    // gets every option (their turn can be any kind).
    const chain = isPerson(turn) || !/^(SA|SB|S1|S3|S5|MU)/.test(turn);
    const p = Alerts.prefs(turn);
    const box = (k, label) => `<label><input type="checkbox" data-k="${k}" ${p[k] ? 'checked' : ''}> ${label}</label>`;
    dlg.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="Track ${esc(label(turn))}">
      <header><h2>Track <span class="num">${esc(label(turn))}</span></h2></header>
      <div class="alertopts"><span class="lbl">Alert me when ${esc(label(turn))}:</span>
        ${box('lineup', 'is lined up')}${box('ordered', 'is ordered')}${box('onDuty', 'goes on duty')}${box('reset', 'is put on a mandatory reset')}
        ${box('position', 'changes board position')}${box('rescue', 'Rescue train appears in the lineup')}
        ${chain ? box('aheadRest', 'has someone ahead go on rest') + box('aheadBack', 'has someone ahead come off rest') : ''}
        ${/^(SD|SR)/.test(turn) || isPerson(turn) ? box('mayCall', 'may be called for a job going spare (no one free on the slow board)') : ''}
        <label>call time moves <select data-k="time">${TIMES.map(([m, l]) => `<option value="${m}" ${m === p.time ? 'selected' : ''}>${l}</option>`).join('')}</select> or more</label>
        <label>remind me <select data-k="before">${BEFORE.map(([m, l]) => `<option value="${m}" ${m === p.before ? 'selected' : ''}>${l}</option>`).join('')}</select> before the expected call</label></div>
      <div id="dlgnote" class="alertnote" hidden></div>
      <div class="btns"><button type="button" class="ok" id="dlgok">OK</button><button type="button" id="dlgcancel">Cancel</button>${was ? '<button type="button" class="stop" id="dlgstop">Stop tracking</button>' : ''}</div></div>`;
    dlg.hidden = false;
    const note = document.getElementById('dlgnote');
    const say = (html, cls) => { note.hidden = !html; note.innerHTML = html || ''; note.className = `alertnote${cls ? ` ${cls}` : ''}`; };
    const close = () => { dlg.hidden = true; dlg.innerHTML = ''; turnBox.value = ''; turnClear.hidden = true; };
    const done = () => { close(); paintTracked(); if (mode === 'current' || mode === 'snap') show(cur, true); };
    Alerts.ready.then(() => {
      const st = Alerts.state(turn);
      if (st === 'ios-home') say(`<b>For alerts on an iPhone</b> (iOS 16.4 or newer), first: Safari → <b>Share</b> → <b>Add to Home Screen</b>, then open the site from that icon and track the turn there. Tapping OK here still picks ${esc(label(turn))} out on the page.`, 'howto');
      else if (st === 'unsupported') say(`This browser can't show alerts (on Android use Chrome). OK still picks ${esc(label(turn))} out on the page.`);
      else if (st === 'none') say(`Alerts aren't set up on this site. OK still picks ${esc(label(turn))} out on the page.`);
    });
    document.getElementById('dlgcancel').onclick = close;
    dlg.onclick = (e) => { if (e.target === dlg) close(); };
    document.getElementById('dlgok').onclick = async (e) => {
      const change = {};
      dlg.querySelectorAll('[data-k]').forEach((el) => { change[el.dataset.k] = el.type === 'checkbox' ? el.checked : +el.value; });
      Alerts.keepPrefs(turn, change);
      keepTracked([...new Set([...tracked(), turn])]);
      if (Alerts.state(turn) !== 'on' && Alerts.state(turn) !== 'off') return done();
      e.currentTarget.disabled = true;
      say('Setting up alerts…');
      try {
        await Alerts.set(turn, true);
        done();
      } catch (err) {
        say(`${esc(label(turn))} is tracked on this page, but alerts couldn't be set up: ${esc(err.message)}.`, 'bad');
        e.currentTarget.disabled = false;
        paintTracked();
      }
    };
    const stop = document.getElementById('dlgstop');
    if (stop) stop.onclick = async () => {
      try {
        if (Alerts.turns().includes(turn)) await Alerts.set(turn, false);
        keepTracked(tracked().filter((t) => t !== turn));
        done();
      } catch (err) { say(`Couldn't stop the alerts: ${esc(err.message)}.`, 'bad'); }
    };
  }

  const turnBox = document.getElementById('turn');
  const turnClear = document.getElementById('turnclear');
  // Enter, or a turn picked from the suggestions (not on leaving the box:
  // tapping OK would open it again).
  // A 4-letter code tracks that person's turn (hidden search).
  async function openTrackAny(v) {
    const t = clean(v);
    if (!isCode(t)) return openTrack(t);
    const list = await Person.find(t);
    const h = `@${await Person.hash(t)}`;
    const cur = list && Person.current(list, Person.pickOf(h));
    if (cur) {
      // Follow the person (alerts move with their home turn) or just the turn they're on now.
      dlg.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><header><h2>Track ${esc(t)}</h2></header>
        <div class="alertnote">${esc(t)} is on <b>${esc(cur.turn)}</b> now. Follow:</div>
        <div class="btns"><button type="button" class="ok" id="dlgperson">👤 ${esc(t)} (alerts move with their turn)</button>
          <button type="button" id="dlgturn">Turn ${esc(cur.turn)} only</button><button type="button" id="dlgcancel">Cancel</button></div></div>`;
      dlg.dataset.turn = '';
      dlg.hidden = false;
      const shut = () => { dlg.hidden = true; dlg.innerHTML = ''; };
      document.getElementById('dlgcancel').onclick = () => { shut(); turnBox.value = ''; turnClear.hidden = true; };
      document.getElementById('dlgturn').onclick = () => { shut(); openTrack(cur.turn); };
      document.getElementById('dlgperson').onclick = () => { shut(); keepCode(h, t); personNow[h] = cur.turn; openTrack(h); };
      return;
    }
    dlg.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><header><h2>Not found</h2></header><div class="alertnote">Nothing found for that in the saved checks. Type a turn, e.g. SR03.</div><div class="btns"><button type="button" class="ok" id="dlgcancel">OK</button></div></div>';
    dlg.dataset.turn = '';
    dlg.hidden = false;
    document.getElementById('dlgcancel').onclick = () => { dlg.hidden = true; dlg.innerHTML = ''; turnBox.value = ''; turnClear.hidden = true; };
  }
  turnBox.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); openTrackAny(turnBox.value); } });
  turnBox.addEventListener('input', (e) => {
    turnClear.hidden = !turnBox.value;
    if (!e.inputType || e.inputType === 'insertReplacementText') openTrack(turnBox.value);
  });
  turnClear.onclick = () => { turnBox.value = ''; turnClear.hidden = true; };
  Alerts.ready.then(paintTracked);
  paintTracked();

  // The turn on the Turn History tab (remembered on this phone).
  function setFocus(t) {
    focus = clean(t);
    // A person search isn't remembered on the phone.
    if (isCode(focus)) return;
    try { focus ? localStorage.setItem('boardTurn', focus) : localStorage.removeItem('boardTurn'); } catch (e) { /* storage off */ }
  }
  try { setFocus(localStorage.getItem('boardTurn') || ''); } catch (e) { /* storage off */ }

  // Turn History tab (owner, 2026-10-24): one turn, from the newest check,
  // with when it goes, totals and its history.
  async function renderTurns() {
    const view = document.getElementById('view');
    setMarks();
    const latestList = await src.load(src.days[0]);
    if (mode !== 'turns') return;
    const s = latestList[latestList.length - 1];
    const options = BoardTurns.turnsIn(s).filter((t) => !BoardTurns.PLACEHOLDER.test(t)).map((t) => `<option value="${t}"></option>`).join('');
    view.innerHTML = `<div class="thead"><div class="when">Turn History</div>
        <div class="turnpick"><label for="tturn">Look up a turn</label><div class="row"><input id="tturn" list="tturnlist" placeholder="e.g. SR03" autocomplete="off" spellcheck="false" maxlength="6" value="${esc(focus)}"><button id="tgo" type="button">Show</button></div>
          <datalist id="tturnlist">${options}</datalist><div class="tracked">${trackChips('Your tracked turns:')}</div></div></div>
      ${focus ? (isCode(focus) ? '<div id="person"><p class="empty">Looking that up…</p></div>' : turnPanel(s)) : '<p class="empty">Type a turn (e.g. SR03) to see where it stands now, when it goes, and everything the saved checks show about it.</p>'}`;
    // A person search stays out of the address bar.
    try { history.replaceState(null, '', focus && !isCode(focus) ? `#turn=${encodeURIComponent(focus)}` : '#turns'); } catch (e) { /* not allowed in some frames */ }
    const box = document.getElementById('tturn');
    const go = () => {
      const t = clean(box.value);
      if (BoardTurns.PLACEHOLDER.test(t)) return noPlaceholder(t);
      if (BoardTurns.SHARED.test(t)) return askCraft(t, (x) => { setFocus(x); renderTurns(); });
      setFocus(t);
      renderTurns();
    };
    box.onkeydown = (e) => { if (e.key === 'Enter') go(); };
    box.onchange = go;
    document.getElementById('tgo').onclick = go;
    view.querySelectorAll('.thead [data-track]').forEach((b) => { b.onclick = () => { const x = b.dataset.track; setFocus(isPerson(x) ? (codes()[x] || nowTurn(x)) : x); renderTurns(); }; });
    if (!focus) return;
    if (isCode(focus)) return showPerson(focus, s);
    if (BoardTurns.PLACEHOLDER.test(focus)) {
      document.querySelector('.turnpanel').outerHTML = `<p class="empty">${esc(focus)} is a placeholder (make-up) turn, so it isn't looked up on its own. Look up the person's own turn, or their name code.</p>`;
      return;
    }
    const want = focus;
    document.getElementById('turnalert').onclick = () => openTrack(want);
    const note = document.getElementById('alertnote');
    Alerts.ready.then(() => {
      if (want !== focus || !note) return;
      const on = Alerts.state(want) === 'on';
      const t = tracked().includes(want);
      note.hidden = false;
      note.textContent = on ? `This phone gets alerts for ${want}.` : t ? `${want} is tracked on this phone (picked out on the page, no alerts).` : `Not tracked on this phone. Tap "Track / alerts" to pick it out on the page and choose its alerts.`;
    });
    whenGo().then((w) => {
      const b = document.getElementById('whengo');
      if (!b || want !== focus || !w) return;
      const lines = w.turns && w.turns[want];
      b.hidden = false;
      b.innerHTML = `<h3>When ${esc(want)} goes <span class="muted">(as of ${esc(when(w.taken).time)})</span></h3>`
        + (lines ? lines.map((l, i) => `<p>${i ? '' : '<b>'}${markTurn(l)}${i ? '' : '</b>'}</p>`).join('')
          : '<p>Not lined up on a train and not in the Sarnia Chain Gang line right now (working, away, or off), or not a turn the board checker follows.</p>');
    });
    src.turns().then((all) => {
      const hb = document.getElementById('turnhist');
      if (!hb || want !== focus) return;
      const hist = all[BoardTurns.splitCraft(want).base];
      const h = turnHistory(hist, s.taken);
      hb.innerHTML = h.changes;
      const more = document.getElementById('turnmore');
      if (more) more.innerHTML = h.more;
      const work = document.getElementById('worklog');
      if (work && hist) { work.innerHTML = workHistory(hist, want); wireWork(work, hist, want); }
      else if (work) work.innerHTML = workHistory(null, want);
      document.querySelectorAll('.turnpanel button[data-taken]').forEach((b) => { b.onclick = () => jumpTo(b.dataset.taken); });
    }).catch(() => {
      const hb = document.getElementById('turnhist');
      if (hb) hb.innerHTML = '<p class="empty" style="padding:0">History isn\'t available right now.</p>';
    });
  }

  // The hidden search's answer: the turns this person was seen on, where
  // they are now, and their history across those turns. No name anywhere.
  async function showPerson(code, s) {
    const box = document.getElementById('person');
    const list = await Person.find(code);
    if (!box || focus !== code) return;
    if (!list) { box.innerHTML = '<p class="empty">Nothing found for that in the saved checks.</p>'; return; }
    const all = await src.turns().catch(() => ({}));
    const hash = await Person.hash(code);
    if (focus !== code || !box.isConnected) return; // looked up again meanwhile
    const cands = Person.candidates(list);
    const cur = Person.current(list, Person.pickOf(hash));
    const live = cur && cur.to >= s.taken;
    const span = (e) => `${esc(when(e.from).time)} ${esc(dt(e.from).split(' ')[0])}${e.to !== e.from ? ` – ${esc(when(e.to).time)} ${esc(dt(e.to).split(' ')[0])}` : ''}`;
    const turns = [...list].reverse().map((e) => `<li>${stampBtn(e.from)}<span><b class="num">${esc(e.turn)}</b> · ${e.own ? 'their turn' : 'working this job'} · ${span(e)}</span></li>`).join('');
    // Their home turn over time (owner, 2026-10-25): their own turns only,
    // one line per change, e.g. B119 (conductor spareboard) → SR03.
    const homes = [];
    for (const e of [...list].filter((x) => x.own).sort((a, b) => (a.from < b.from ? -1 : 1))) {
      const last = homes[homes.length - 1];
      if (last && last.turn === e.turn) { if (e.to > last.to) last.to = e.to; } else homes.push({ ...e });
    }
    // "now" on the turn they're on now (the latest of it), not on whichever started last.
    const nowHome = live ? homes.filter((e) => e.turn === cur.turn).sort((a, b) => (a.to < b.to ? 1 : -1))[0] : null;
    const homeList = homes.length ? `<ul>${[...homes].reverse().map((e) => `<li>${stampBtn(e.from)}<span><b class="num">${esc(e.turn)}</b>${e === nowHome ? ' · <b>now</b>' : ''} · ${span(e)}</span></li>`).join('')}</ul>`
      : '<p class="empty" style="padding:0">Not seen on a turn of their own yet.</p>';
    const rec = personHistory(list, all);
    const h = turnHistory(rec, s.taken);
    const prev = focus;
    focus = live ? cur.turn : '';
    setMarks();
    const here = live ? BoardTurns.facts(s, cur.turn) : [];
    box.innerHTML = `<section class="sheet turnpanel"><header><h2>Person search</h2>${live ? '<div class="hbtns"><button id="turnalert" type="button">🔔 Track / alerts</button></div>' : ''}</header>
      <div id="whengo" class="whengo" hidden></div>
      <div class="alertnote">${live ? `Now on <b>${esc(cur.turn)}</b>.` : `Last seen on <b>${esc(cur.turn)}</b>, ${esc(dt(cur.to))}.`}${cands.length > 1
        ? `<div class="pickturn">This code matches more than one turn right now. Which is yours? ${cands.map((c) => `<button type="button" data-pickp="${esc(c)}" aria-pressed="${c === cur.turn}">${esc(c)}</button>`).join('')}</div>` : ''}</div>
      <div id="worklog" class="work">${workHistory(rec, cur.turn)}</div>
      <div class="tp"><div><h3>Home turn</h3>${homeList}<h3 style="margin-top:12px">Turns seen on</h3><ul>${turns}</ul>${here.length ? `<h3 style="margin-top:12px">Now</h3><ul>${here.map((x) => `<li><span class="kind">${KIND[x.kind] || ''}</span><span>${markTurn(x.text)}</span></li>`).join('')}</ul>` : ''}</div>
      <div><h3>Changes <span class="muted">(that lasted 30 m or more)</span></h3><div class="hist">${h.changes}</div></div></div>
      <div class="tp tp3">${h.more}</div></section>`;
    focus = prev;
    box.querySelectorAll('[data-pickp]').forEach((b) => { b.onclick = () => { Person.setPick(hash, b.dataset.pickp); showPerson(code, s); }; });
    wireWork(box.querySelector('#worklog'), rec, cur.turn);
    box.querySelectorAll('button[data-taken]').forEach((b) => { b.onclick = () => jumpTo(b.dataset.taken); });
    if (!live) return;
    box.querySelector('#turnalert').onclick = () => openTrack(cur.turn);
    whenGo().then((w) => {
      const b = box.querySelector('#whengo');
      const lines = w && w.turns && w.turns[cur.turn];
      if (!b || focus !== code || !lines) return;
      b.hidden = false;
      b.innerHTML = `<h3>When ${esc(cur.turn)} goes <span class="muted">(as of ${esc(when(w.taken).time)})</span></h3>` + lines.map((l, i) => `<p>${i ? '' : '<b>'}${esc(l)}${i ? '' : '</b>'}</p>`).join('');
    });
  }

  window.addEventListener('jumpto', (e) => jumpTo(e.detail));
  async function jumpTo(taken) {
    if (mode !== 'snap') setMode('snap');
    const d = taken.slice(0, 10);
    if (d === day) {
      const i = list.findIndex((s) => s.taken === taken);
      if (i >= 0) return show(i);
    }
    if (src.days.includes(d)) openDay(d, taken);
  }

  function show(i, keepTab) {
    cur = i;
    if (document.body.classList.contains('orders') || mode === 'turns') return;
    const s = list[i];
    document.getElementById('turnlist').innerHTML = BoardTurns.turnsIn(s).filter((t) => !BoardTurns.PLACEHOLDER.test(t)).map((t) => `<option value="${t}"></option>`).join('');
    setMarks();
    if (marks.length && !keepTab) {
      const mine = s.pools.findIndex((q) => q.turns.some((t) => marked(t.turn)));
      if (mine >= 0) poolTab = mine;
    }
    const w = when(s.taken);
    const dayIdx = src.days.indexOf(day);
    const atOldest = i === 0 && dayIdx === src.days.length - 1;
    const atNewest = i === list.length - 1 && dayIdx === 0;
    document.querySelectorAll('#rail button').forEach((b) => b.setAttribute('aria-current', +b.dataset.i === i));
    try { history.replaceState(null, '', mode === 'current' ? '#current' : '#' + slug(s.taken)); } catch (e) { /* not allowed in some frames */ }
    // The newest snapshot is the current board until the next change; its
    // age is from the last check that saw it. Any other one is history.
    const latest = atNewest;
    const lastSeen = s.sameUntil || s.taken;
    const agebar = latest
      ? `<div class="agebar" data-live="1"><span class="age" data-age="${esc(lastSeen)}" data-prefix="Last checked "></span>${s.sameUntil ? `<span class="sub">no change since ${esc(w.time)}</span>` : ''}${mode === 'current' ? '' : '<span class="sub">This is the current board.</span>'}</div>`
      : `<div class="agebar old"><span class="age" data-age="${esc(s.taken)}" data-prefix="Taken "></span><span class="sub">Not the current board.</span><button type="button" class="tocurrent" id="tocurrent">Go to current</button></div>`;
    const screens = ['callBoard', ...s.screens].map((k) => {
      const name = k === 'callBoard' ? 'Call board' : SCREENS[k] || k;
      return JUMPS[k] ? `<button type="button" class="chip" data-jump="${esc(k)}">${esc(name)}</button>` : `<span class="chip">${esc(name)}</span>`;
    }).join('');
    const same = s.sameUntil ? `<span class="chip">No change until ${esc(when(s.sameUntil).time)}</span>` : '';
    document.getElementById('view').innerHTML = `
      <div class="head">
        <div><div class="when">${esc(w.long)}<span class="num">${esc(w.time)}</span></div>
          ${agebar}
          <div class="screens" style="margin-top:8px">${screens}${same}</div></div>
        ${mode === 'current' ? '' : `<div class="steps"><button id="older" ${atOldest ? 'disabled' : ''}>◀ Earlier</button><button id="newer" ${atNewest ? 'disabled' : ''}>Later ▶</button></div>`}
      </div>
      ${newerBar}
      ${strip(s)}
      <div class="grid">
        <div class="col">${lineup(s)}${toronto(s)}${changes(s)}</div>
        <div class="col">${flags(s)}${pools(s, poolTab)}${vacancies(s)}${onDuty(s)}${yardJobs(s)}${sequence(s)}</div>
      </div>
      <p class="note">Times are railway (Toronto) time, as CATS shows them. The pool chips and "rules say" come from the board checker's reading of the crew-calling rules, not from CATS.</p>`;
    tickAges();
    paintTracked(s);
    if (mode !== 'current') {
      document.getElementById('older').onclick = () => step(-1);
      document.getElementById('newer').onclick = () => step(1);
    }
    const back = document.getElementById('tocurrent');
    if (back) back.onclick = () => setMode('current');
    const upd = document.getElementById('newerbtn');
    if (upd) upd.onclick = () => { location.hash = '#current'; location.reload(); };
    document.querySelectorAll('[data-pool]').forEach((b) => { b.onclick = () => { poolTab = +b.dataset.pool; show(cur, true); }; });
    document.querySelectorAll('[data-jump]').forEach((b) => { b.onclick = () => {
      const j = JUMPS[b.dataset.jump];
      if (j.pool) {
        const i = s.pools.findIndex((q) => q.name.startsWith(j.pool));
        if (i >= 0 && i !== poolTab) { poolTab = i; show(cur, true); }
      }
      const el = document.getElementById(j.id);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      el.classList.add('jumped');
      setTimeout(() => el.classList.remove('jumped'), 1500);
    }; });
  }

  // Snapshots ⇄ Order summary ⇄ 14h. setMode(true) is the order summary.
  const order = { day: null, open: null, find: '', from: 'all' };
  const modeCurrent = document.getElementById('modeCurrent');
  const modeSnap = document.getElementById('modeSnap');
  const modeTurns = document.getElementById('modeTurns');
  const modeOrders = document.getElementById('modeOrders');
  const modeHeld = document.getElementById('modeHeld');
  const modeAna = document.getElementById('modeAna');
  function setMode(m) {
    mode = m === true ? 'orders' : m === false ? 'snap' : m;
    document.body.classList.toggle('orders', mode === 'orders' || mode === 'held' || mode === 'analytics');
    document.body.classList.toggle('current', mode === 'current');
    document.body.classList.toggle('turns', mode === 'turns');
    modeCurrent.setAttribute('aria-pressed', mode === 'current');
    modeTurns.setAttribute('aria-pressed', mode === 'turns');
    modeSnap.setAttribute('aria-pressed', mode === 'snap');
    modeOrders.setAttribute('aria-pressed', mode === 'orders');
    modeHeld.setAttribute('aria-pressed', mode === 'held');
    modeAna.setAttribute('aria-pressed', mode === 'analytics');
    if (mode === 'orders') renderOrders();
    else if (mode === 'held') renderHeld();
    else if (mode === 'analytics') renderAnalytics();
    else if (mode === 'turns') renderTurns();
    else if (mode === 'current') { if (day === src.days[0] && list.length) show(list.length - 1); else openDay(src.days[0]); }
    else if (list.length) show(cur);
  }
  let heldOpen = null;
  // Crew names (data/names.json), unlocked with the passcode this device
  // remembers. A passcode that no longer works (changed on the laptop) is
  // dropped, so the box asks again.
  let namesCache = null;
  async function heldNames() {
    const locked = await src.names();
    if (!locked || !window.BoardNames || !window.crypto || !crypto.subtle) return { names: null, state: 'none' };
    if (namesCache) return { names: namesCache, state: 'unlocked' };
    const pass = local.get(PASS_KEY);
    if (pass) {
      namesCache = await BoardNames.unlockNames(locked, pass).catch(() => null);
      if (!namesCache) local.del(PASS_KEY);
    }
    return namesCache ? { names: namesCache, state: 'unlocked' } : { names: null, state: 'locked' };
  }
  async function renderHeld() {
    const view = document.getElementById('view');
    view.innerHTML = '<p class="empty">Loading…</p>';
    let all;
    try { all = await src.trains(); } catch (e) { view.innerHTML = '<p class="empty">The 14h list isn\'t available right now.</p>'; return; }
    if (mode !== 'held') return;
    const { names, state } = await heldNames();
    if (mode !== 'held') return;
    view.innerHTML = heldView(all, heldOpen, src.live ? src.index.latest : null, names, state);
    const unlock = document.getElementById('unlock');
    if (unlock) {
      unlock.onsubmit = async (e) => {
        e.preventDefault();
        const pass = document.getElementById('npass').value;
        const err = unlock.querySelector('.uerr');
        err.textContent = 'Unlocking…';
        const got = await BoardNames.unlockNames(await src.names(), pass).catch(() => null);
        if (!got) { err.textContent = 'That passcode doesn\'t open the names.'; return; }
        local.set(PASS_KEY, pass);
        namesCache = got;
        renderHeld();
      };
    }
    const forget = document.getElementById('nforget');
    if (forget) forget.onclick = () => { local.del(PASS_KEY); namesCache = null; renderHeld(); };
    try { history.replaceState(null, '', '#14h'); } catch (e) { /* not allowed in some frames */ }
    view.querySelectorAll('tr.row').forEach((tr) => { tr.onclick = () => { heldOpen = heldOpen === tr.dataset.key ? null : tr.dataset.key; renderHeld(); }; });
    const form = view.querySelector('form.gf');
    if (form) {
      const r = heldRows(all).find((x) => heldKey(x) === heldOpen);
      wireGrievance(form, r && r.co);
      form.closest('.gform').scrollIntoView({ block: 'start' });
      if (!form.elements.name.value) form.elements.name.focus({ preventScroll: true });
    }
  }
  async function renderOrders() {
    const view = document.getElementById('view');
    view.innerHTML = '<p class="empty">Loading the order summary…</p>';
    let all;
    try { all = await src.trains(); } catch (e) { view.innerHTML = '<p class="empty">The order summary isn\'t available right now.</p>'; return; }
    if (mode !== 'orders') return;
    // Searching a train opens the day it belongs to.
    const q = order.find.trim().toUpperCase().replace(/\s+/g, '');
    const match = q && all.find((r) => r.id.replace(/\s+/g, '') === q);
    if (match) { order.day = match.day; order.open = `${match.id} ${match.month}`; order.from = 'all'; }
    if (!order.day) order.day = (all.find((r) => r.onDuty) || all[0] || {}).day;
    view.innerHTML = ordersView(all, order.day, order.open, order.find, order.from);
    try { history.replaceState(null, '', '#orders'); } catch (e) { /* not allowed in some frames */ }
    document.getElementById('oday').onchange = (e) => { order.day = e.target.value; order.open = null; order.find = ''; renderOrders(); };
    document.getElementById('ofrom').onchange = (e) => { order.from = e.target.value; order.open = null; renderOrders(); };
    const find = document.getElementById('ofind');
    find.onkeydown = (e) => { if (e.key === 'Enter') { order.find = find.value; renderOrders(); } };
    find.onchange = () => { order.find = find.value; renderOrders(); };
    view.querySelectorAll('tr.row').forEach((tr) => { tr.onclick = () => { order.open = order.open === tr.dataset.key ? null : tr.dataset.key; order.find = ''; renderOrders(); }; });
    view.querySelectorAll('.story button[data-taken]').forEach((b) => { b.onclick = (e) => { e.stopPropagation(); setMode(false); jumpTo(b.dataset.taken); }; });
    view.querySelectorAll('.story button[data-share]').forEach((b) => { b.onclick = (e) => { e.stopPropagation(); shareLink(`#train=${encodeURIComponent(b.dataset.share.replace(/\s+/g, '-'))}`, `Train ${b.dataset.share}`, b); }; });
    const open = view.querySelector('tr.open');
    if (open && (match || order.jump)) open.scrollIntoView({ block: 'center' });
    order.jump = false;
  }

  // Analytics tab (owner, 2026-10-26): a train number, turn or name code,
  // within the dates picked. A name code is never put in the address bar or
  // kept on the phone.
  // Opens on the last 90 days, so only those archive months load (F7).
  const ana = { q: '', kind: 'auto', range: '90', from: '', to: '', sec: 'trains', pool: 'SR' };
  const RANGES = [['7', 'Last 7 days'], ['14', 'Last 14 days'], ['30', 'Last 30 days'], ['90', 'Last 90 days'], ['365', 'Last year'], ['all', 'Everything kept'], ['custom', 'Pick dates…']];
  const NO_ARCHIVE = { trains: [], work: {}, spares: {}, rests: {}, people: {}, runarounds: [], spareJobs: [], sleep: [] };
  function anaDates() {
    if (ana.range === 'all') return {};
    if (ana.range === 'custom') return { from: ana.from, to: ana.to };
    return { from: new Date((torontoNowMin() - (+ana.range - 1) * 1440) * 60000).toISOString().slice(0, 10) };
  }
  let anaCsv = null; // what the Spreadsheet button saves: { name, runs }
  // The archive, a month per file (F7): only the months the dates need
  // (from the month before, for things that started then), each fetched once.
  const archMonths = new Map();
  async function loadArchive(range) {
    const idx = await src.archive();
    if (!idx) return null;
    if (!idx.months) return idx; // a build from before the split: one file
    const first = range.from ? new Date(Date.parse(range.from.slice(0, 7) + '-01T12:00:00Z') - 2 * 864e5).toISOString().slice(0, 7) : '';
    const want = idx.months.filter((m) => (!first || m >= first) && (!range.to || m <= range.to.slice(0, 7)));
    const parts = await Promise.all(want.map((m) => archMonths.get(m) || archMonths.set(m, getJSON(`data/archive-${m}.json`).catch(() => null)).get(m)));
    const out = { ...NO_ARCHIVE, work: {}, spares: {}, rests: {}, people: {}, since: idx.since };
    for (const p of parts.filter(Boolean)) {
      for (const k of ['trains', 'runarounds', 'spareJobs', 'sleep']) out[k] = out[k].concat(p[k] || []);
      for (const k of ['work', 'spares', 'rests', 'people']) for (const [t, l] of Object.entries(p[k] || {})) out[k][t] = (out[k][t] || []).concat(l);
    }
    return out;
  }
  // One tooltip for every chart column (hover, tap or keyboard focus).
  const tip = document.createElement('div');
  tip.className = 'ctip';
  tip.hidden = true;
  document.body.appendChild(tip);
  const showTip = (el) => {
    tip.textContent = el.dataset.tip;
    tip.hidden = false;
    const r = el.getBoundingClientRect();
    const w = tip.offsetWidth;
    tip.style.left = `${Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2))}px`;
    tip.style.top = `${Math.max(8, r.top - tip.offsetHeight - 6)}px`;
  };
  const view0 = document.getElementById('view');
  view0.addEventListener('pointerover', (e) => { const b = e.target.closest('.cbar[data-tip]'); if (b) showTip(b); });
  view0.addEventListener('pointerout', (e) => { if (e.target.closest('.cbar[data-tip]')) tip.hidden = true; });
  view0.addEventListener('focusin', (e) => { const b = e.target.closest('.cbar[data-tip]'); if (b) showTip(b); });
  view0.addEventListener('focusout', () => { tip.hidden = true; });
  window.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });

  async function renderAnalytics() {
    try { await drawAnalytics(); } catch (e) {
      // Never leave the tab on "Loading…" (owner, 2026-10-26).
      document.getElementById('view').innerHTML = `<p class="empty">Analytics hit a problem (${esc(e.message)}). Try another search or the Clear button.</p>`;
      console.error(e);
    }
  }
  async function drawAnalytics() {
    const view = document.getElementById('view');
    if (!view.querySelector('.ohead.ana')) view.innerHTML = '<p class="empty">Loading…</p>';
    let live;
    let turnsAll;
    let found;
    let arch;
    try {
      [live, turnsAll, found, arch] = await Promise.all([src.trains(), src.turns().catch(() => ({})), src.analytics(), loadArchive(anaDates())]);
    } catch (e) { view.innerHTML = '<p class="empty">Analytics aren\'t available right now.</p>'; return; }
    if (mode !== 'analytics') return;
    arch = { ...NO_ARCHIVE, ...(arch || {}) };
    found = { runarounds: [], spareJobs: [], sleep: [], ...(found || {}) };
    // What the site has now, plus the archive from before its first day;
    // anything in both once (BoardAnalytics.joinOld, the archive's copy).
    const { joinOld } = BoardAnalytics;
    const all = joinOld('trains', arch.trains, live);
    const byId = BoardAnalytics.indexTrains(all);
    const range = anaDates();
    const inDates = (st) => { const d = (st || '').slice(0, 10); return !!d && (!range.from || d >= range.from) && (!range.to || d <= range.to); };
    const runarounds = joinOld('runarounds', arch.runarounds, found.runarounds).filter((r) => inDates(r.taken));
    const spareJobs = joinOld('spareJobs', arch.spareJobs, found.spareJobs).filter((j) => inDates(j.first));
    const sleep = joinOld('sleep', arch.sleep, found.sleep).filter((z) => inDates(z.onDuty));
    const unique = (rows) => { const seen = new Set(); return rows.filter((o) => { const k = `${String(o.train).replace(/ \(\S+\)$/, '')}|${o.at}`; if (seen.has(k)) return false; seen.add(k); return true; }); };
    // The trains a turn worked: Turn History's work history and the archive's.
    const workOf = (turn) => {
      const { base, craft } = BoardTurns.splitCraft(turn);
      const old = (arch.work[base] || []).filter((o) => !craft || !o.crew || BoardTurns.crewHasCraft(o.crew, base, craft));
      return unique([...worked(turnsAll[base], turn), ...old]);
    };
    const countIn = (turn, k) => joinOld(k, arch[k][turn] || [], (turnsAll[turn] || {})[k] || []).filter((x) => inDates(x.seen)).length;
    const took = (turn) => runarounds.filter((r) => r.turn === turn && !r.fixed).length;
    const { inRange, runOf, trainRuns, workRuns, between, turnRow, poolOf, kindOf } = BoardAnalytics;

    const q = ana.q.trim().toUpperCase().replace(/\s+/g, ' ');
    const kind = ana.kind !== 'auto' ? ana.kind : kindOf(q, [...Object.keys(turnsAll), ...Object.keys(arch.work)], all);
    let body;
    anaCsv = null;
    if (!q) {
      const runs = BoardAnalytics.newestFirst(inRange(all.map(runOf), range));
      let turnRows = null;
      if (ana.sec === 'turns') {
        const turns = [...new Set([...Object.keys(turnsAll), ...Object.keys(arch.work)])].filter((t) => poolOf(t) === ana.pool && !BoardTurns.PLACEHOLDER.test(t));
        turnRows = turns.map((t) => turnRow(t, inRange(workRuns(workOf(t), byId, t), range), { spares: countIn(t, 'spares'), rests: countIn(t, 'rests'), tookOutOfTurn: took(t) }));
      }
      anaCsv = { name: 'all-trains', runs };
      body = analyticsOverview({ runs, sec: ana.sec, pool: ana.pool, turnRows, runarounds, spareJobs, sleep });
    } else if (kind === 'train') {
      const runs = inRange(trainRuns(all, q), range);
      const ids = [...new Set(runs.map((r) => r.id.split(' ')[0]))];
      anaCsv = { name: `train-${q.replace(/\s+/g, '-')}`, runs };
      body = analyticsView(runs, 'train', q === 'DH' ? 'All deadheads' : /^\d+$/.test(q) ? `Every ${q}` : `Train ${q}`, ids.length > 1 ? `${ids.length} symbols: ${esc(ids.slice(0, 8).join(', '))}${ids.length > 8 ? ', …' : ''}` : '',
        { runarounds: runarounds.filter((r) => BoardAnalytics.trainMatches(r.train, q) && !r.fixed).length, shownWrong: runarounds.filter((r) => BoardAnalytics.trainMatches(r.train, q)).length });
    } else if (kind === 'turn') {
      const { base } = BoardTurns.splitCraft(q);
      if (BoardTurns.PLACEHOLDER.test(base)) body = `<p class="empty">${esc(base)} is a placeholder (make-up) turn, so it isn't looked up on its own.</p>`;
      // 501/502 is two turns with one number (F2): conductor or engineer, like Turn History.
      else if (BoardTurns.SHARED.test(q)) body = `<p class="anote"><b>${esc(q)}</b> is two turns with one number. Which one?</p><p>${['CO', 'EN'].map((c) => `<button type="button" class="qbtn" style="margin-right:18px;font-size:16px" data-q="${esc(q)}-${c}" data-kind="turn">${esc(q)} ${c === 'CO' ? 'conductor' : 'engineer'}</button>`).join('')}</p>`;
      else {
        const runs = inRange(workRuns(workOf(q), byId, base), range);
        anaCsv = { name: `turn-${q}`, runs };
        body = analyticsView(runs, 'turn', `Turn ${q}`, turnsAll[base] || arch.work[base] ? '' : 'no history for this turn in the saved checks',
          { between: between(runs), spares: countIn(base, 'spares'), took: took(base), sleep: sleep.filter((z) => z.turn === q || (z.turn === base && !BoardTurns.SHARED.test(base))) });
      }
    } else {
      // A person: the live stretches (people.json) and the archive's.
      const ok = /^[A-Z]{4}$/.test(q) && window.crypto && crypto.subtle;
      const [list, h] = ok ? await Promise.all([Person.find(q), Person.hash(q)]) : [null, null];
      if (mode !== 'analytics') return;
      const old = (h && arch.people[h]) || [];
      const stretches = [...(list || []), ...old];
      if (!stretches.length) body = '<p class="empty">Nothing found for that name code in the saved checks.</p>';
      else {
        const oldWork = old.flatMap((e) => (arch.work[e.turn] || []).filter((o) => (o.seen || o.at) >= e.from && (o.seen || o.at) <= e.to).map((o) => ({ ...o, turn: e.turn })));
        const runs = inRange(workRuns(unique([...worked(list ? personHistory(list, turnsAll) : null, ''), ...oldWork]), byId), range);
        anaCsv = { name: 'person', runs };
        // Their calls: on a turn while they were on it.
        const mine = sleep.filter((z) => stretches.some((e) => e.turn === BoardTurns.splitCraft(z.turn).base && z.firstSeen <= e.to && z.seen >= e.from));
        body = analyticsView(runs, 'code', 'Person search', `last seen on ${esc(Person.current(stretches, h && Person.pickOf(h)).turn)}`, { between: between(runs), spares: null, sleep: mine });
      }
    }
    const dates = ana.range === 'custom'
      ? `<label for="afrom">From<input type="date" id="afrom" value="${esc(ana.from)}"></label><label for="ato">To<input type="date" id="ato" value="${esc(ana.to)}"></label>` : '';
    view.innerHTML = `<div class="ohead ana">
        <div><div class="sec-title" style="margin-bottom:6px">Analytics</div><div class="when">${esc((RANGES.find((r) => r[0] === ana.range) || RANGES[5])[1].replace('…', ''))}</div></div>
        <div class="ctl">
          <label for="aq">Search<input id="aq" placeholder="148, SR03, name code" value="${esc(ana.q)}" autocomplete="off" spellcheck="false" maxlength="12"></label>
          <label for="akind">Look for<select id="akind">${[['auto', 'Work it out'], ['train', 'Train number'], ['turn', 'Turn'], ['code', 'Name code']].map(([k, l]) => `<option value="${k}"${k === ana.kind ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
          <label for="arange">Dates<select id="arange">${RANGES.map(([k, l]) => `<option value="${k}"${k === ana.range ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
          ${dates}
          <div class="abtns">${q ? '<button type="button" id="aclear">Clear search</button>' : ''}${anaCsv && anaCsv.runs.length ? '<button type="button" id="acsv">⬇ Spreadsheet</button>' : ''}</div>
        </div>
      </div>${body}`;
    try { history.replaceState(null, '', '#analytics'); } catch (e) { /* not allowed in some frames */ }
    const box = document.getElementById('aq');
    const go = () => { ana.q = box.value; renderAnalytics(); };
    box.onkeydown = (e) => { if (e.key === 'Enter') go(); };
    box.onchange = go;
    document.getElementById('akind').onchange = (e) => { ana.kind = e.target.value; ana.q = box.value; renderAnalytics(); };
    document.getElementById('arange').onchange = (e) => { ana.range = e.target.value; renderAnalytics(); };
    const af = document.getElementById('afrom');
    if (af) {
      af.onchange = () => { ana.from = af.value; renderAnalytics(); };
      document.getElementById('ato').onchange = (e) => { ana.to = e.target.value; renderAnalytics(); };
    }
    const clear = document.getElementById('aclear');
    if (clear) clear.onclick = () => { ana.q = ''; ana.kind = 'auto'; renderAnalytics(); };
    const csvBtn = document.getElementById('acsv');
    if (csvBtn) {
      csvBtn.onclick = () => {
        const blob = new Blob(['﻿' + BoardAnalytics.csv(anaCsv.runs)], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `analytics-${anaCsv.name}-${new Date(torontoNowMin() * 60000).toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      };
    }
    view.querySelectorAll('button[data-sec]').forEach((b) => { b.onclick = () => { ana.sec = b.dataset.sec; renderAnalytics(); }; });
    const pool = document.getElementById('apool');
    if (pool) pool.onchange = () => { ana.pool = pool.value; renderAnalytics(); };
    view.querySelectorAll('button[data-q]').forEach((b) => { b.onclick = () => { ana.q = b.dataset.q; ana.kind = b.dataset.kind; renderAnalytics(); window.scrollTo(0, 0); }; });
    view.querySelectorAll('button[data-taken]').forEach((b) => { b.onclick = () => jumpTo(b.dataset.taken); });
    view.querySelectorAll('tr.row[data-key]').forEach((tr) => {
      tr.onclick = () => { Object.assign(order, { day: tr.dataset.day, open: tr.dataset.key, find: '', from: 'all', jump: true }); setMode(true); };
    });
  }
  modeCurrent.onclick = () => setMode('current');
  modeSnap.onclick = () => setMode(false);
  modeTurns.onclick = () => setMode('turns');
  modeOrders.onclick = () => setMode(true);
  modeHeld.onclick = () => setMode('held');
  modeAna.onclick = () => setMode('analytics');

  document.getElementById('rail').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-i]');
    if (b) show(+b.dataset.i);
  });
  daySel.onchange = () => openDay(daySel.value);

  // The landing is Current. A link like #2026-10-15-0815 opens that
  // snapshot; #orders the order summary; #14h the 14-hour list.
  // Shared links: #turn=SR07 opens that turn on Turn History (#turns the
  // tab itself); #train=M38261-22 opens that train in the Order summary.
  const shared = /^#(turn|train)=(.+)$/.exec(location.hash);
  if (shared && shared[1] === 'turn') setFocus(decodeURIComponent(shared[2]));
  if (shared && shared[1] === 'train') order.find = decodeURIComponent(shared[2]).replace(/-/g, ' ');
  const wantOrders = location.hash === '#orders' || (shared && shared[1] === 'train');
  const wantHeld = location.hash === '#14h';
  const wantAna = location.hash === '#analytics';
  const wantTurns = location.hash === '#turns' || (shared && shared[1] === 'turn');
  const m = /^(\d{4}-\d{2}-\d{2})-(\d{4})$/.exec(location.hash.slice(1));
  if (m && src.days.includes(m[1])) { setMode('snap'); openDay(m[1], `${m[1]} ${m[2]}`); }
  else { await openDay(src.days[0]); if (!wantOrders && !wantHeld && !wantTurns && !wantAna) setMode('current'); }
  if (wantOrders) setMode(true);
  else if (wantHeld) setMode('held');
  else if (wantTurns) setMode('turns');
  else if (wantAna) setMode('analytics');

  // A newer board published while this page is open: offer it (live site only).
  if (src.live) {
    setInterval(async () => {
      try {
        const idx = await getJSON('data/index.json');
        if (!idx.latest || newerBar) return;
        if (idx.latest !== src.index.latest) {
          newerBar = `<div class="newer">A newer board was published (${esc(when(idx.latest).time)}).<button type="button" id="newerbtn">Update</button></div>`;
          if (mode === 'current' || mode === 'snap') show(cur);
          return;
        }
        // Same board, checked again since (owner, 2026-10-22): move "Last
        // checked" on in place, no reload needed.
        if (!idx.checked || idx.checked === src.index.checked) return;
        src.index = idx;
        showUpdated(idx);
        Person.reset(); // a followed person may be on another turn now
        const s = list.find((x) => x.taken === idx.latest);
        if (s && idx.checked > s.taken) s.sameUntil = idx.checked;
        if (mode === 'current' || mode === 'snap') show(cur, true);
      } catch (e) { /* offline: try again next time */ }
    }, 120000);
  }
}).catch((err) => {
  document.getElementById('view').innerHTML = `<p class="empty">Couldn't load the snapshots (${esc(err.message)}).</p>`;
});
</script>
</body>
</html>
