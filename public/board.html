<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board Tracker · Sample</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #105292;
    --blue: #1a66b0;
    --gold: #ffb822;
    --bg: #f4f6fa;
    --panel: #ffffff;
    --border: #dbe3ef;
    --text: #1c2733;
    --muted: #5c6b7e;
    --you: #fff6df;
    --warn: #b4540a;
    --ok: #1d7a46;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'DM Sans', -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 16px;
    text-align: center;
    background: var(--navy);
    color: #fff;
    border-bottom: 4px solid var(--gold);
  }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; }
  header .sub { color: #d7e6fb; font-size: 13px; margin-top: 4px; }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 60px; }
  .mono { font-family: 'DM Mono', ui-monospace, Consolas, monospace; }

  .banner {
    font-size: 13px; color: var(--muted); background: #eef3fa; border: 1px dashed var(--border);
    border-radius: 8px; padding: 8px 12px; margin-bottom: 14px;
  }
  .checks { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .checks button {
    font: inherit; font-weight: 600; font-size: 14px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel); color: var(--navy); cursor: pointer;
  }
  .checks button[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }

  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 16px;
  }
  h2 {
    font-size: 12.5px; font-weight: 700; color: var(--navy); text-transform: uppercase;
    letter-spacing: 0.04em; margin: 0 0 10px;
  }
  .hero { border-left: 5px solid var(--gold); }
  .hero .lead { font-size: 18px; font-weight: 600; margin: 0 0 6px; line-height: 1.35; }
  .hero ul { margin: 6px 0 0; padding-left: 18px; color: var(--text); }
  .hero li { margin: 3px 0; }
  .asof { color: var(--muted); font-size: 13px; margin-bottom: 8px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 7px 8px; border-bottom: 1px solid #edf1f7; vertical-align: top; }
  tr.you td { background: var(--you); }
  tr.you td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
  .ORD { background: #dff3e7; color: var(--ok); }
  .PLN { background: #eef1f6; color: var(--muted); }
  .spare { color: var(--warn); }
  .muted { color: var(--muted); }
  .scroll { overflow-x: auto; }
  .extra { margin-top: 10px; font-size: 13.5px; }
  .extra b { color: var(--navy); }

  details { margin-top: 4px; }
  details summary { cursor: pointer; color: var(--blue); font-size: 13px; }
  .reason { font-size: 13px; color: var(--muted); margin-top: 4px; }
  ul.changes { margin: 0; padding-left: 0; list-style: none; font-size: 13.5px; }
  ul.changes li { padding: 3px 0; border-bottom: 1px dashed #edf1f7; }
  ul.flags { margin: 0; padding-left: 18px; color: var(--warn); font-size: 14px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 24px; }

  @media (max-width: 560px) {
    .hide-sm { display: none; }
    table { font-size: 13px; }
    td, th { padding: 6px 5px; }
  }
</style>
</head>
<body>
<header>
  <h1>Board Tracker</h1>
  <div class="sub">When do I go to work? · Sarnia road (Chain Gang)</div>
</header>
<main>
  <div class="banner">Sample page built from saved board-check snapshots (names masked). Not live CATS data.</div>
  <div class="checks" id="checks" role="group" aria-label="Board checks"></div>
  <div id="view"><p class="muted">Loading…</p></div>
  <footer>Times are railway (Toronto) time. The rules engine decides every answer; check CATS before you rely on it.</footer>
</main>
<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function hero(c, me) {
  const [first, ...rest] = c.me;
  const lead = first.replace(/^WHEN YOU GO \([^)]*\):\s*/, '').replace(/^./, (ch) => ch.toUpperCase());
  return `<section class="panel hero">
    <h2>When you go (${esc(me)})</h2>
    <div class="asof">Board check as of <b>${esc(c.asOf)}</b></div>
    <p class="lead">${esc(lead)}</p>
    ${rest.length ? `<ul>${rest.map((l) => `<li>${esc(l.trim())}</li>`).join('')}</ul>` : ''}
  </section>`;
}

function board(title, rows, me, c) {
  if (!rows.length) return '';
  const body = rows.map((t) => `<tr class="${t.turn === me ? 'you' : ''}">
      <td class="mono">${esc(t.pos)}</td><td class="mono"><b>${esc(t.turn)}</b>${t.turn === me ? ' ← you' : ''}</td>
      <td class="${/spare/.test(t.status) ? 'spare' : ''}">${esc(t.status)}</td></tr>`).join('');
  const extra = c ? [
    c.returning.length ? `<div><b>Coming home:</b> ${esc(c.returning.join(', '))}</div>` : '',
    c.away.length ? `<div><b>In Toronto:</b> ${esc(c.away.join(', '))}</div>` : '',
  ].join('') : '';
  return `<section class="panel"><h2>${title}</h2>
    <table><thead><tr><th>Pos</th><th>Turn</th><th>Status</th></tr></thead><tbody>${body}</tbody></table>
    ${extra ? `<div class="extra">${extra}</div>` : ''}</section>`;
}

function lineup(c) {
  if (!c.lineup.length) return '';
  const body = c.lineup.map((p) => `<tr class="${p.mine ? 'you' : ''}">
      <td class="mono">${esc(p.order)}</td>
      <td><span class="tag ${p.status}">${esc(p.status)}</span></td>
      <td class="mono"><b>${esc(p.train)}</b>${p.deadhead ? ' <span class="muted">DH</span>' : ''}</td>
      <td class="mono hide-sm">~${esc(p.call)}</td>
      <td><span class="${/spare/.test(p.goesTo) ? 'spare' : ''}">${esc(p.goesTo)}</span>${p.mine ? ' ← you' : ''}
        <details><summary>why</summary><div class="reason">${esc(p.reason)}</div></details></td></tr>`).join('');
  return `<section class="panel"><h2>Train line-up (41) · who's projected on each</h2>
    <div class="scroll"><table><thead><tr><th>Order</th><th></th><th>Train</th><th class="hide-sm">Call</th><th>Goes to</th></tr></thead>
    <tbody>${body}</tbody></table></div></section>`;
}

function onDuty(c) {
  if (!c.onDuty.length) return '';
  const body = c.onDuty.map((t) => {
    const bad = t.actual && t.actual !== t.expected && t.actual !== 'MU';
    return `<tr><td class="mono">${esc(t.order)}</td><td class="mono"><b>${esc(t.train)}</b></td>
      <td class="mono">${esc(t.turn || '–')}</td><td>${esc(t.expected)}${bad ? ' <span class="spare">≠ ' + esc(t.actual) + '</span>' : ''}</td></tr>`;
  }).join('');
  return `<section class="panel"><h2>Already on duty out of Sarnia</h2>
    <table><thead><tr><th>Order</th><th>Train</th><th>Turn</th><th>Sequence says</th></tr></thead><tbody>${body}</tbody></table></section>`;
}

function changes(c, i) {
  const list = c.changes.filter((l) => l.trim());
  const items = list.map((l) => `<li class="mono">${esc(l.trim())}</li>`).join('');
  const open = list.length <= 8 ? ' open' : '';
  return `<section class="panel"><h2>Changes since the previous check</h2>
    ${i === 0 || !list.length ? `<p class="muted">${esc((list[0] || 'None.').replace(/^CHANGES:\s*/, ''))}</p>`
      : `<details${open}><summary>${list.length} changes</summary><ul class="changes">${items}</ul></details>`}</section>`;
}

function flags(c) {
  if (!c.flags.length) return '';
  return `<section class="panel"><h2>Possible problems (for you to judge)</h2>
    <ul class="flags">${c.flags.map((f) => `<li>${esc(f)}</li>`).join('')}</ul></section>`;
}

function render(data, i) {
  const c = data.checks[i];
  document.querySelectorAll('#checks button').forEach((b, j) => b.setAttribute('aria-pressed', j === i));
  document.getElementById('view').innerHTML = hero(c, data.me)
    + board('Chain Gang board (Sarnia, conductors)', c.gang, data.me, c)
    + board('SD board (Sarnia, engineers)', c.sd, data.me)
    + lineup(c) + onDuty(c) + changes(c, i) + flags(c)
    + `<p class="muted" style="font-size:12px">Snapshot: ${esc(c.note)}</p>`;
}

fetch('board-sample.json').then((r) => r.json()).then((data) => {
  const bar = document.getElementById('checks');
  data.checks.forEach((c, i) => {
    const b = document.createElement('button');
    b.textContent = c.asOf;
    b.onclick = () => render(data, i);
    bar.appendChild(b);
  });
  render(data, data.checks.length - 1);
}).catch((err) => {
  document.getElementById('view').innerHTML = `<p class="spare">Couldn't load the sample data: ${esc(err.message)}</p>`;
});
</script>
</body>
</html>
