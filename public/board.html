<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Line-up Snapshots</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f5c63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Line-up">
<link rel="apple-touch-icon" href="board-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="board-icon-192.png">
<script>
  // Page style picked in ⚙ Settings (owner, 2026-10-26): light, dark, retro
  // (CATS's own colours) or retro tablet (CATS in the GLINK 3270 app).
  // Not picked: follows the phone.
  try { const t = localStorage.getItem('boardTheme'); if (/^(light|dark|retro|tablet)$/.test(t || '')) document.documentElement.dataset.theme = t; } catch (e) { /* storage off */ }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Layout: a dispatcher's register. Snapshot rail on the left (chips on a phone),
     the line-up as the main timetable, pools and the call board as compact side sheets. */
  :root {
    --bg: #eceeea;
    --sheet: #fbfbf9;
    --ink: #1d2a2e;
    --soft: #5d6b6f;
    --rule: #d3d8d4;
    --rule-soft: #e4e7e3;
    --accent: #0f5c63;
    --accent-ink: #ffffff;
    --accent-tint: #dcebec;
    --amber: #a8630a;
    --amber-tint: #f6e7cf;
    --go: #1f7344;
    --go-tint: #dbeedf;
    --stop: #a3352b;
    --stop-tint: #f5dcd8;
    --plan-tint: #e3e7e4;
    --poolA: #2f5fa8;
    --poolB: #7a4fa0;
    --poolSR: #0f5c63;
    --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #12191b; --sheet: #1a2326; --ink: #e2e9e8; --soft: #95a5a7; --rule: #2e3b3e; --rule-soft: #243033;
    --accent: #5fb3ba; --accent-ink: #0d1517; --accent-tint: #1d3538;
    --amber: #e3a34a; --amber-tint: #3a2c15; --go: #6cc68f; --go-tint: #1b3324; --stop: #ec8a7f; --stop-tint: #3d211e;
    --plan-tint: #273235; --poolA: #86aee8; --poolB: #c3a0e3; --poolSR: #5fb3ba; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #12191b; --sheet: #1a2326; --ink: #e2e9e8; --soft: #95a5a7; --rule: #2e3b3e; --rule-soft: #243033;
    --accent: #5fb3ba; --accent-ink: #0d1517; --accent-tint: #1d3538;
    --amber: #e3a34a; --amber-tint: #3a2c15; --go: #6cc68f; --go-tint: #1b3324; --stop: #ec8a7f; --stop-tint: #3d211e;
    --plan-tint: #273235; --poolA: #86aee8; --poolB: #c3a0e3; --poolSR: #5fb3ba; color-scheme: dark; }
  /* Retro (owner, 2026-10-26): CATS's own colours, from the owner's
     screenshot of its main menu: light grey screen, navy labels, maroon
     menu text, black data, yellow highlight, white boxes with black edges;
     fixed-width letters, square corners. */
  :root[data-theme="retro"] {
    --bg: #f1f1f1; --sheet: #f1f1f1; --ink: #000000; --soft: #000080; --rule: #000080; --rule-soft: #b8b8d8;
    --accent: #000080; --accent-ink: #ffffff; --accent-tint: #ffff00;
    --amber: #806000; --amber-tint: #ffff00; --go: #006400; --go-tint: #e2f1e2; --stop: #b00000; --stop-tint: #f6dede;
    --plan-tint: #e4e4ee; --poolA: #000080; --poolB: #800080; --poolSR: #800000;
    /* CATS's font is Courier New; phones without it (Android) get Courier Prime, drawn to match. */
    --display: 'Courier New', 'Courier Prime', Courier, monospace; --body: 'Courier New', 'Courier Prime', Courier, monospace;
    --mono: 'Courier New', 'Courier Prime', Courier, monospace;
    color-scheme: light; }
  :root[data-theme="retro"] * { border-radius: 0 !important; box-shadow: none !important; }
  :root[data-theme="retro"] .top h1, :root[data-theme="retro"] h2, :root[data-theme="retro"] h3 { color: #800000; letter-spacing: 0.02em; }
  :root[data-theme="retro"] input, :root[data-theme="retro"] select { background: #ffffff !important; border: 1px solid #000000 !important; color: #000000; }
  :root[data-theme="retro"] .sheet, :root[data-theme="retro"] .strip { background: #f1f1f1; }
  /* Retro Tablet (owner, 2026-10-26): CATS in the GLINK 3270 app, from the
     owner's photos: black screen, blue labels, cyan menu text and header
     bars (blue letters on cyan), white numbers, green line-up data, yellow
     messages, red urgent times, grey title boxes and F-key chips; tall
     narrow letters (Barlow Condensed, the nearest to GLINK's). */
  :root[data-theme="tablet"] {
    --bg: #000000; --sheet: #000000; --ink: #f4f4f4; --soft: #5c8aff; --rule: #2b3f99; --rule-soft: #17235a;
    --accent: #3fe0d8; --accent-ink: #000000; --accent-tint: #0c3533;
    --amber: #ffff3c; --amber-tint: #2e2e08; --go: #3dff52; --go-tint: #0b2a0f; --stop: #ff3b30; --stop-tint: #3a0c0a;
    --plan-tint: #0e1633; --poolA: #5c8aff; --poolB: #ff79d8; --poolSR: #3fe0d8;
    --display: 'Barlow Condensed', 'Arial Narrow', sans-serif; --body: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --mono: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    color-scheme: dark; }
  :root[data-theme="tablet"] * { border-radius: 0 !important; box-shadow: none !important; }
  :root[data-theme="tablet"] body { font-size: 17px; font-weight: 500; }
  :root[data-theme="tablet"] .top h1 { background: #d6d6d6; color: #111111; padding: 2px 12px; }
  :root[data-theme="tablet"] .sheet > header, :root[data-theme="tablet"] table thead th { background: #3fe0d8; color: #1236d0; }
  :root[data-theme="tablet"] .sheet > header h2, :root[data-theme="tablet"] .sheet > header .meta { color: #1236d0; }
  :root[data-theme="tablet"] h3, :root[data-theme="tablet"] .sec-title { color: #3fe0d8; }
  :root[data-theme="tablet"] .modes button { background: #d6d6d6; color: #111111; border-color: #d6d6d6; }
  :root[data-theme="tablet"] .modes button[aria-pressed="true"] { background: #3fe0d8; color: #000000; border-color: #3fe0d8; }
  :root[data-theme="tablet"] input, :root[data-theme="tablet"] select { background: #000000 !important; color: #f4f4f4; border: 1px solid #5c8aff !important; }
  :root[data-theme="tablet"] .num, :root[data-theme="tablet"] .mono { font-variant-numeric: tabular-nums; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); }
  .num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .top {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding-block: 18px 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-bottom: 3px solid var(--ink);
  }
  .top h1 { margin: 0; font: 700 30px/1 var(--display); letter-spacing: 0.02em; text-transform: uppercase; }
  .top .where { color: var(--soft); font-size: 13.5px; }
  .top .updated { margin-left: auto; font-size: 12.5px; color: var(--soft); }
  /* ⚙ Settings (owner, 2026-10-26) */
  .top { position: relative; padding-right: max(64px, calc(env(safe-area-inset-right, 0px) + 48px)); }
  .gear { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); width: 40px; height: 40px; display: grid; place-items: center;
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; cursor: pointer; color: var(--ink); }
  .gear svg { width: 22px; height: 22px; }
  .settings { position: absolute; top: 58px; right: max(12px, env(safe-area-inset-right, 0px)); z-index: 40; width: min(300px, calc(100vw - 24px));
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); }
  .settings[hidden] { display: none; }
  .settings h2 { margin: 0 0 8px; font: 600 12px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); }
  .settings .styles { display: grid; gap: 6px; }
  .settings button.sty { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; min-height: 44px;
    background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; cursor: pointer; font-size: 14px; }
  .settings button.sty[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
  .settings .sw { width: 34px; height: 24px; border-radius: 4px; border: 1px solid var(--rule); flex: none; display: grid; place-items: center; font: 600 11px/1 'IBM Plex Mono', monospace; }
  .settings .note { font-size: 12px; color: var(--soft); margin: 10px 0 0; }
  .settings .note button { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 12px; }
  .top .sample { margin-left: auto; font-size: 12px; color: var(--amber); background: var(--amber-tint); padding: 3px 8px; border-radius: 3px; }

  .wrap {
    display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 24px; max-width: 1280px; margin: 0 auto;
    padding-block: 20px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* Snapshot rail */
  .rail { position: sticky; top: 16px; align-self: start; }
  .rail h2, .sec-title { font: 600 13px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); margin: 0 0 10px; }
  .daypick { display: grid; gap: 4px; margin-bottom: 12px; font-size: 12px; color: var(--soft); }
  .daypick select { font: inherit; font-size: 14px; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 8px; }
  .turnpick { display: grid; gap: 4px; margin-bottom: 14px; font-size: 12px; color: var(--soft); }
  .turnpick .row { display: flex; gap: 6px; }
  .turnpick input { flex: 1 1 auto; width: 0; min-width: 0; font: 600 15px/1 var(--mono); text-transform: uppercase; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 8px; }
  .turnpick input::placeholder { font-weight: 400; text-transform: none; color: var(--soft); }
  .rail .turnpick button { display: inline-block; width: auto; flex: none; margin: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 0 12px; cursor: pointer; color: var(--soft); white-space: nowrap; }
  .hit, tr.hit td { background: var(--amber-tint); }
  .train.hit { box-shadow: inset 4px 0 0 var(--amber); }
  tr.hit td:first-child { box-shadow: inset 4px 0 0 var(--amber); }
  mark.t { background: none; color: var(--amber); font-weight: 700; }
  .turnpanel { margin-bottom: 22px; border-color: var(--amber); }
  .turnpanel > header { background: var(--amber-tint); }
  .turnpanel > header h2 .num { font-size: 22px; letter-spacing: 0; }
  .turnpanel > header button { background: none; border: 1px solid var(--rule); border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
  .turnpanel > header .hbtns { display: flex; gap: 6px; flex-wrap: wrap; }
  .turnpanel > header button.alert-on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .alertnote { padding: 8px 14px; font-size: 13px; color: var(--soft); border-bottom: 1px solid var(--rule-soft); }
  .alertnote.bad { color: var(--stop); }
  .alertnote.howto { color: var(--ink); background: var(--accent-tint); }
  .alertnote.howto ol { margin: 6px 0 2px; padding-left: 20px; }
  .alertnote.howto li { margin: 3px 0; }
  .alertopts { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 14px; font-size: 13px; border-bottom: 1px solid var(--rule-soft); }
  .alertopts .lbl { color: var(--soft); }
  .alertopts label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .alertopts select { font: inherit; padding: 2px 4px; }
  .alertopts[hidden] { display: none; }
  .whengo { padding: 10px 14px; border-bottom: 1px solid var(--rule-soft); background: var(--go-tint); }
  .whengo[hidden] { display: none; }
  .whengo h3 { margin: 0 0 4px; }
  .whengo p { margin: 2px 0; }
  .sharebtn { background: none; border: 1px solid var(--rule); border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
  .status-line { font-size: 12px; color: var(--soft); }
  .tp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
  .tp > div { min-width: 0; padding: 12px 14px; }
  .tp > div + div { border-left: 1px solid var(--rule-soft); }
  .tp3 { grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--rule-soft); }
  .tp3:empty { display: none; }
  .tp h3 .muted { text-transform: none; letter-spacing: 0; font-family: var(--body); font-weight: 400; }
  .tp h3 { margin: 0 0 8px; font: 600 12px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); }
  .tp ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
  .tp li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 6px; }
  .tp .kind { font: 600 11px/1.6 var(--mono); color: var(--soft); text-transform: uppercase; }
  .hist { max-height: 320px; overflow-y: auto; }
  .tp .hist li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; font-size: 13px; padding: 4px 6px; border-radius: 3px; }
  .hist li.now { background: var(--accent-tint); }
  .hist button { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--accent); font: 500 12.5px/1.4 var(--mono); }
  .rail .same { display: block; font-size: 11.5px; color: var(--soft); }
  .rail ol { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--rule); }
  .rail li { margin: 0; }
  .rail button {
    display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    padding: 8px 10px 8px 14px; margin-left: -2px; border-left: 2px solid transparent; border-radius: 0 4px 4px 0;
  }
  .rail button:hover { background: var(--rule-soft); }
  .rail button[aria-current="true"] { border-left-color: var(--accent); background: var(--accent-tint); }
  .rail .d { display: none; font-size: 12px; color: var(--soft); }
  .rail .t { display: block; font: 600 20px/1.1 var(--mono); }
  .rail .n { display: block; font-size: 12px; color: var(--soft); }
  .rail .day { font: 600 12px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--soft); padding: 12px 0 4px 14px; }
  .rail .day:first-child { padding-top: 2px; }

  /* Header of the chosen snapshot + summary strip */
  .head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .head .when { font: 700 40px/1 var(--display); letter-spacing: 0.01em; }
  .head .when .num { font: 600 34px/1 var(--mono); margin-left: 6px; }
  .head .screens { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 3px; background: var(--plan-tint); color: var(--soft); white-space: nowrap; }
  button.chip { border: 0; font-family: inherit; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .sheet.jumped { outline: 2px solid var(--soft); outline-offset: 2px; }
  .steps { margin-left: auto; display: flex; gap: 6px; }
  .steps button { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 13.5px; }
  .steps button:disabled { opacity: 0.4; cursor: default; }
  /* How old a snapshot is, and the way back to the current one. */
  .agebar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 14px; }
  .agebar .age { font: 600 13.5px/1.2 var(--mono); padding: 4px 8px; border-radius: 3px; background: var(--go-tint); color: var(--go); }
  .agebar.old .age { background: var(--amber-tint); color: var(--amber); }
  .agebar.stale .age { background: var(--stop-tint); color: var(--stop); }
  .agebar .sub { color: var(--soft); font-size: 13px; }
  .tocurrent, .newer button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px; padding: 7px 14px; min-height: 36px; font: 600 13.5px/1 var(--body); cursor: pointer; }
  .newer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; margin-bottom: 14px; border: 1px solid var(--accent); background: var(--accent-tint); font-size: 14px; }
  /* Current: the newest snapshot only; the turn search stays, the list goes. */
  body.current .rail h2, body.current .rail .daypick, body.current #rail { display: none; }

  .strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--rule); background: var(--sheet); margin-bottom: 22px; }
  .strip.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stat { padding: 12px 14px; border-left: 1px solid var(--rule); }
  .stat:first-child { border-left: 0; }
  .stat .v { font: 600 28px/1 var(--mono); }
  .stat .v small { font-size: 14px; color: var(--soft); font-weight: 500; }
  .stat .l { font-size: 12.5px; color: var(--soft); margin-top: 4px; }
  .stat.alert .v { color: var(--stop); }

  .grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 22px; align-items: start; }
  .col { display: grid; gap: 22px; min-width: 0; }
  .sheet { background: var(--sheet); border: 1px solid var(--rule); min-width: 0; }
  .sheet > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 14px 10px; border-bottom: 1px solid var(--rule); }
  .sheet > header h2 { margin: 0; font: 700 19px/1.1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; }
  .sheet > header .meta { font-size: 12.5px; color: var(--soft); }
  .sheet .foot { padding: 10px 14px; font-size: 12.5px; color: var(--soft); border-top: 1px solid var(--rule-soft); }

  /* Line-up timetable */
  .daybar { font: 600 12px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); background: var(--bg); padding: 6px 14px; border-bottom: 1px solid var(--rule-soft); }
  .train { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 4px 14px; padding: 11px 14px; border-bottom: 1px solid var(--rule-soft); }
  .train:last-child { border-bottom: 0; }
  .train .time { font: 600 18px/1.2 var(--mono); }
  .train .sym { font: 600 16px/1.2 var(--mono); }
  .train .sym .od { color: var(--soft); font-weight: 400; }
  .train .sub { font-size: 12.5px; color: var(--soft); margin-top: 2px; }
  .train .sub .mono { font-size: 12px; }
  .train .right { text-align: right; display: grid; gap: 4px; justify-items: end; align-content: start; }
  .st { font: 600 11px/1 var(--mono); letter-spacing: 0.06em; padding: 4px 6px; border-radius: 3px; }
  .st.ORD { background: var(--go-tint); color: var(--go); }
  .st.PLN { background: var(--plan-tint); color: var(--soft); }
  .rule-say { grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; }
  .pool { font: 600 11.5px/1 var(--mono); padding: 4px 7px; border-radius: 3px; color: var(--accent-ink); background: var(--soft); }
  .pool.A { background: var(--poolA); }
  .pool.B { background: var(--poolB); }
  .pool.SR { background: var(--poolSR); }
  .spare { color: var(--amber); font-weight: 600; }
  details.why summary { cursor: pointer; color: var(--accent); font-size: 12.5px; list-style: none; }
  details.why summary::-webkit-details-marker { display: none; }
  details.why summary::before { content: '+ '; }
  details.why[open] summary::before { content: '− '; }
  details.why p { margin: 4px 0 0; font-size: 13px; color: var(--soft); max-width: 62ch; }
  .rule-say details { flex-basis: 100%; }

  /* Compact lists */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font: 600 11.5px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--soft); padding: 8px 14px 6px; }
  td { padding: 7px 14px; border-top: 1px solid var(--rule-soft); vertical-align: top; }
  td.num, td .num { white-space: nowrap; }
  .scroll { overflow-x: auto; }
  .tabs { display: flex; gap: 2px; padding: 8px 14px 0; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 8px 8px; cursor: pointer; font-size: 13.5px; color: var(--soft); }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .stat-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--go); vertical-align: 1px; }
  .stat-dot.wait { background: var(--soft); }
  .stat-dot.out { background: var(--poolA); }
  .stat-dot.spare { background: var(--amber); }
  .crew { color: var(--soft); font-size: 12px; }
  .away { padding: 10px 14px; font-size: 13px; border-top: 1px solid var(--rule-soft); display: grid; gap: 3px; }
  .away b { font-weight: 600; }
  .ok { color: var(--go); }
  .bad { color: var(--stop); font-weight: 600; }

  .changes { list-style: none; margin: 0; padding: 0; font-size: 13px; max-height: 340px; overflow-y: auto; }
  .changes li { display: grid; grid-template-columns: 18px minmax(0, 1fr); padding: 6px 14px; border-top: 1px solid var(--rule-soft); }
  .changes li:first-child { border-top: 0; }
  .changes .g { font: 600 14px/1.3 var(--mono); }
  .changes .add .g { color: var(--go); }
  .changes .del .g { color: var(--stop); }
  .changes .mod .g { color: var(--amber); }
  .flags { margin: 0; padding: 12px 14px 12px 32px; color: var(--stop); font-size: 13.5px; }
  .empty { padding: 12px 14px; color: var(--soft); font-size: 13.5px; margin: 0; }
  .note { font-size: 12px; color: var(--soft); margin: 22px 0 0; max-width: 80ch; }

  .modes { display: flex; gap: 4px; margin-left: 12px; flex-wrap: wrap; }
  .modes button { background: none; border: 1px solid var(--rule); border-radius: 4px; padding: 5px 12px; cursor: pointer; font: 600 13px/1 var(--body); color: var(--soft); }
  .modes button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  body.orders .rail, body.turns .rail { display: none; }
  body.orders .wrap, body.turns .wrap { grid-template-columns: minmax(0, 1fr); }
  /* Tracked turns (owner, 2026-10-24): chips under Find a turn, and the
     alerts box that opens when a turn is looked up on Current/Snapshots. */
  .tracked { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tracked:empty { display: none; }
  .tsum { list-style: none; margin: 8px 0 0; padding: 0; width: 100%; display: grid; gap: 8px; font-size: 13px; color: var(--ink); }
  .tsum li { border-left: 3px solid var(--amber); padding: 2px 0 2px 8px; }
  .tsum li div { color: var(--soft); }
  .tsum .go { font-weight: 600; }
  .tsum .go:empty { display: none; }
  .tracked .lbl { width: 100%; font-size: 12px; color: var(--soft); }
  .rail .tracked button, .thead .turnpick .tracked button { display: inline-flex; gap: 4px; align-items: center; width: auto; margin: 0; padding: 4px 9px; border: 1px solid var(--amber); border-left-width: 1px; border-radius: 4px; background: var(--amber-tint); color: var(--ink); font: 600 13px/1.2 var(--mono); cursor: pointer; }
  .dlg-back { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: flex; align-items: flex-start; justify-content: center; padding: 60px 16px 16px; z-index: 50; overflow-y: auto; }
  .dlg-back[hidden] { display: none; }
  .dlg { background: var(--sheet); border: 1px solid var(--amber); width: 100%; max-width: 460px; }
  .dlg > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 14px 10px; border-bottom: 1px solid var(--rule); background: var(--amber-tint); }
  .dlg > header h2 { margin: 0; font: 700 19px/1.1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; }
  .dlg .alertopts { flex-direction: column; align-items: flex-start; gap: 8px; }
  .dlg .btns { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 14px; }
  .dlg .btns button { border: 1px solid var(--rule); background: none; color: var(--ink); border-radius: 4px; padding: 0 14px; min-height: 40px; font: 600 14px/1 var(--body); cursor: pointer; }
  .dlg .btns button.ok { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .dlg .btns button.stop { margin-left: auto; color: var(--stop); }
  /* Turn History tab */
  .thead { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .thead .when { font: 700 40px/1 var(--display); }
  .thead .turnpick { margin: 0; min-width: 220px; }
  .thead .turnpick button { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 0 12px; cursor: pointer; color: var(--soft); }
  /* Work history (owner, 2026-10-25): trains worked; tap one for its call history. */
  .work { padding: 0 0 4px; border-bottom: 1px solid var(--rule-soft); }
  .work h3 { margin: 12px 14px 8px; font: 600 12px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); }
  .work table { width: 100%; }
  .work tr.wrow { cursor: pointer; }
  .work tr.wrest td { font-size: 12.5px; padding-top: 4px; padding-bottom: 4px; background: var(--bg); }
  .work tr.wrow:hover td { background: var(--rule-soft); }
  .work tr.open td { background: var(--accent-tint); }
  .work td.det { padding: 8px 14px 12px; background: var(--bg); }
  .work .det ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13.5px; }
  .work table { table-layout: fixed; }
  .work td, .work th { overflow-wrap: anywhere; }
  .work th:nth-child(1) { width: 30%; } .work th:nth-child(2) { width: 34%; }
  .work .det li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; }
  .work .det li span { min-width: 0; overflow-wrap: anywhere; }
  .work .det button[data-taken] { font-size: 11.5px; padding: 3px 4px; }
  .work .det h4 { margin: 0 0 6px; font-size: 12px; color: var(--soft); font-weight: 600; }
  @media (max-width: 700px) {
    .thead .when { font-size: 30px; }
  }
  .ohead { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .ohead .when { font: 700 40px/1 var(--display); }
  .ohead .ctl { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .ohead label { display: grid; gap: 4px; font-size: 12px; color: var(--soft); }
  .ohead select, .ohead input { font: inherit; font-size: 14px; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 7px 8px; }
  .ohead input { font-family: var(--mono); text-transform: uppercase; width: 150px; }
  .ohead input::placeholder { font-family: var(--body); text-transform: none; color: var(--soft); }
  table.orders td, table.orders th { white-space: nowrap; }
  table.orders tr.row { cursor: pointer; }
  table.orders tr.row:hover td { background: var(--rule-soft); }
  table.orders tr.open td { background: var(--accent-tint); }
  table.orders tr.hit td { background: var(--amber-tint); }
  .offv { font: 600 13px/1 var(--mono); }
  .offv.ok { color: var(--go); }
  .offv.warn { color: var(--amber); }
  .offv.bad { color: var(--stop); }
  .offv.none { color: var(--soft); font-weight: 400; }
  .story td { background: var(--sheet) !important; white-space: normal !important; padding: 4px 14px 14px 30px; }
  .story ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13.5px; }
  .story li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; }
  .story li .k { font-weight: 600; }
  .story li.big .k { color: var(--accent); }
  .story button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); font: 500 12.5px/1.5 var(--mono); text-align: left; }
  .story .sum { margin-top: 10px; display: grid; gap: 3px; font-size: 13.5px; }
  .chg { color: var(--amber); font-weight: 600; }
  .from { font: 600 10.5px/1 var(--mono); padding: 2px 5px; border-radius: 3px; background: var(--plan-tint); color: var(--soft); margin-left: 4px; }
  .fl-red b.id { color: var(--stop); }
  .fl-yellow b.id { color: var(--amber); background: var(--amber-tint); padding: 0 3px; border-radius: 2px; }
  .flagtxt { display: block; font: 600 11.5px/1.3 var(--body); white-space: normal; margin-top: 2px; }
  .fl-red .flagtxt { color: var(--stop); }
  .fl-yellow .flagtxt { color: var(--amber); }
  /* 14h tab */
  .held { font: 600 13px/1 var(--mono); color: var(--stop); }
  .held.now { color: var(--amber); }
  .gform { padding: 14px; border-top: 2px solid var(--accent); background: var(--accent-tint); }
  .gform h3 { margin: 0 0 8px; font: 700 17px/1.1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; }
  .gform .gnote { font-size: 12.5px; color: var(--soft); margin: 0 0 12px; max-width: 80ch; }
  .gform .ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 14px; max-width: 980px; }
  .gform fieldset { border: 0; margin: 0; padding: 0; display: contents; }
  .gform legend { grid-column: 1 / -1; font: 700 15px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 6px; padding: 0; }
  .gform label { display: grid; gap: 4px; font-size: 12px; color: var(--soft); }
  .gform input, .gform select { font: inherit; font-size: 16px; color: var(--ink); background: var(--sheet); min-width: 0; border: 1px solid var(--rule); border-radius: 4px; padding: 7px 8px; min-height: 40px; width: 100%; }
  .gform .dt { display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 6px; }
  .gform .seg { display: flex; gap: 6px; }
  .gform .seg input { width: auto; min-height: 0; margin: 0; accent-color: var(--accent); }
  .gform .seg label { white-space: nowrap; flex: 1; justify-content: center;
    display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; padding: 0 10px; min-height: 40px; cursor: pointer; }
  .gform .gsum { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 14px; font-size: 13.5px; }
  .gform .gsum b { font-family: var(--mono); }
  .gform .gerr { color: var(--stop); font-weight: 600; }
  .pname { display: block; font: 500 12px/1.3 var(--body); color: var(--soft); white-space: normal; margin-top: 2px; }
  .unlock { display: grid; gap: 6px; padding: 12px 14px; margin-bottom: 14px; border: 1px solid var(--rule); background: var(--sheet); font-size: 13.5px; }
  .unlock label { font-size: 12.5px; color: var(--soft); }
  .unlock .row2 { display: flex; gap: 8px; }
  .unlock input { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 7px 8px; min-height: 40px; flex: 1; min-width: 0; max-width: 320px; }
  .unlock button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px; padding: 0 14px; min-height: 40px; font: 600 14px/1 var(--body); cursor: pointer; }
  .unlock div > button, div.unlock button { justify-self: start; }
  .unlock .uerr { color: var(--stop); font-weight: 600; font-size: 13px; }
  .gform button.gen { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px; padding: 10px 16px; min-height: 44px; font: 600 14px/1 var(--body); cursor: pointer; }
  .gform button.gen:disabled { background: var(--rule); color: var(--soft); cursor: not-allowed; }
  /* Analytics tab (owner, 2026-10-26) */
  .agrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .agrid > div { min-width: 0; padding: 12px 14px; border-top: 1px solid var(--rule-soft); }
  .agrid h3 { margin: 0 0 8px; font: 600 12px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); }
  .alist { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
  .alist li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dotted var(--rule-soft); padding-bottom: 3px; }
  .alist li b { font-family: var(--mono); }
  .alist button { background: none; border: 0; padding: 0; font: 600 14px/1.3 var(--mono); color: var(--accent); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .anote { font-size: 13.5px; color: var(--soft); margin: -6px 0 14px; }
  .anote b { color: var(--ink); }
  table.orders tr.nolink { cursor: default; }
  table.orders tr.nolink:hover td { background: none; }
  .agrid.wide { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .strip.two { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .secpick { margin-bottom: 14px; }
  .secpick .tabs { border-bottom: 0; padding-bottom: 6px; }
  .poolpick { font-size: 12px; color: var(--soft); display: flex; gap: 6px; align-items: center; }
  .poolpick select { font: inherit; font-size: 14px; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 4px 6px; }
  .qbtn { background: none; border: 0; padding: 0; font: 600 14px/1.3 var(--mono); color: var(--accent); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .abtns { display: flex; gap: 8px; align-items: flex-end; }
  .abtns button { background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; padding: 7px 10px; font: inherit; font-size: 13.5px; cursor: pointer; min-height: 36px; }
  .ohead input[type="date"] { width: auto; text-transform: none; font-family: var(--body); }
  /* Charts: one series, the accent colour, columns 24 px at most with a 4 px
     rounded top, a 2 px gap, hairline grid; one tooltip (.ctip). */
  .chart h3 .muted { text-transform: none; letter-spacing: 0; font-family: var(--body); font-weight: 400; }
  .cplot { position: relative; height: 140px; margin: 6px 0 0 30px; border-bottom: 1px solid var(--rule); }
  .cgl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--rule-soft); }
  .cgl span { position: absolute; right: calc(100% + 6px); top: -7px; font: 11px/1 var(--mono); color: var(--soft); }
  .cbars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px; }
  .cbar { flex: 1 1 0; min-width: 0; height: 100%; display: flex; align-items: flex-end; justify-content: center; cursor: default; }
  .cbar i { display: block; width: 100%; max-width: 24px; background: var(--accent); border-radius: 4px 4px 0 0; }
  .cbar:hover i, .cbar:focus-visible i { opacity: 0.7; }
  .cbar:focus { outline: none; }
  .cbar:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cx { display: flex; gap: 2px; margin-left: 30px; font: 11px/1.6 var(--mono); color: var(--soft); }
  .cx span { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: visible; }
  .ctable { margin-top: 6px; font-size: 13px; }
  .ctable summary { cursor: pointer; color: var(--soft); font-size: 12.5px; }
  .ctable table { margin-top: 4px; border-collapse: collapse; }
  .ctable td { padding: 2px 0; border-bottom: 1px dotted var(--rule-soft); }
  .ctip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--sheet); font: 600 13px/1.3 var(--body); padding: 5px 8px; border-radius: 4px; max-width: 260px; }
  .ctip[hidden] { display: none; }
  .stat .v .offv { font: inherit; padding: 0; background: none; }
  table.orders .stick { position: sticky; left: 0; z-index: 1; background: var(--sheet); }
  @media (max-width: 700px) { table.orders .hide-sm { display: none; } }
  .pickturn { margin-top: 6px; font-size: 13.5px; color: var(--ink); }
  .pickturn button { margin: 4px 6px 0 0; padding: 4px 10px; min-height: 34px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; cursor: pointer; font: 600 14px/1 var(--mono); }
  .pickturn button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .vt { color: var(--amber); font: 600 13px/1 var(--mono); }
  :root[data-theme="retro"] .vt { background: #ffff00; color: #000000; padding: 1px 3px; }
  .moves { margin: 4px 0 0; padding-left: 16px; font: 12.5px/1.5 var(--mono); }
  table.orders td details summary { cursor: pointer; }
  @media (max-width: 700px) {
    .ohead .when { font-size: 30px; }
    .ohead .ctl { margin-left: 0; }
    .modes { margin-left: 0; }
    .story li { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .tp { grid-template-columns: minmax(0, 1fr); }
    .tp > div + div { border-left: 0; border-top: 1px solid var(--rule-soft); }
    .tp3 { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 1020px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 760px) {
    .wrap { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-top: 12px; }
    .rail { position: static; }
    .rail h2 { display: none; }
    .rail .same { display: none; }
    .rail ol { display: flex; gap: 8px; overflow-x: auto; border-left: 0; padding-bottom: 4px; }
    .rail .day { display: none; }
    .daypick { grid-template-columns: auto 1fr; align-items: center; gap: 8px; }
    .rail .d { display: block; }
    .rail button { border: 1px solid var(--rule); border-radius: 4px; margin: 0; padding: 6px 12px; white-space: nowrap; background: var(--sheet); }
    .rail button[aria-current="true"] { border-color: var(--accent); }
    .rail .t { font-size: 16px; }
    .strip:not(.three) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .strip .stat { padding: 10px; }
    .strip .stat .v { font-size: 22px; }
    .head .when { font-size: 30px; }
    .head .when .num { font-size: 26px; }
    .steps { margin-left: 0; }
    .top .sample { margin-left: 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .rail button, .tabs button { transition: background-color 0.12s, border-color 0.12s; }
  }
</style>
</head>
<body>
<div class="top">
  <h1>Line-up Snapshots</h1>
  <span class="where">Sarnia road · what CATS showed when each check ran</span>
  <div class="modes" role="group" aria-label="View"><button id="modeCurrent" type="button" aria-pressed="true">Current</button><button id="modeTurns" type="button" aria-pressed="false">Turn History</button><button id="modeSnap" type="button" aria-pressed="false">Snapshots</button><button id="modeOrders" type="button" aria-pressed="false">Order summary</button><button id="modeHeld" type="button" aria-pressed="false">Article 18.6(b)</button><button id="modeAna" type="button" aria-pressed="false">Analytics</button></div>
  <span class="sample" id="sample" hidden>Sample data · names masked</span>
  <span class="updated" id="updated" hidden></span>
  <button type="button" class="gear" id="gear" aria-label="Settings" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  <div class="settings" id="settings" role="dialog" aria-label="Settings" hidden>
    <h2>Page style</h2>
    <div class="styles">
      <button type="button" class="sty" data-theme="light"><span class="sw" style="background:#fbfbf9;color:#1d2a2e;border-color:#d3d8d4">Aa</span>Light</button>
      <button type="button" class="sty" data-theme="dark"><span class="sw" style="background:#1a2326;color:#e2e9e8;border-color:#2e3b3e">Aa</span>Dark</button>
      <button type="button" class="sty" data-theme="retro"><span class="sw" style="background:#f1f1f1;color:#800000;border-color:#000080;font-family:'Courier New','Courier Prime',monospace">Aa</span>Retro</button>
      <button type="button" class="sty" data-theme="tablet"><span class="sw" style="background:#000;color:#3fe0d8;border-color:#5c8aff;font-family:'Barlow Condensed',sans-serif;font-size:13px">Aa</span>Retro Tablet</button>
    </div>
    <p class="note" id="stynote"></p>
  </div>
</div>
<div class="wrap">
  <nav class="rail" aria-label="Snapshots">
    <div class="turnpick">
      <label for="turn">Find a turn</label>
      <div class="row"><input id="turn" list="turnlist" placeholder="e.g. SR03" autocomplete="off" spellcheck="false" maxlength="6"><button id="turnclear" type="button" aria-label="Clear turn" hidden>✕</button></div>
      <datalist id="turnlist"></datalist>
      <div id="tracked" class="tracked"></div>
    </div>
    <h2>Snapshots</h2>
    <label class="daypick" for="day"><span>Day</span><select id="day"></select></label>
    <ol id="rail"></ol>
  </nav>
  <main id="view"><p class="empty">Loading snapshots…</p></main>
</div>
<div id="trackdlg" class="dlg-back" hidden></div>
<script src="board-turns.js"></script>
<script src="board-trains.js"></script>
<script src="board-analytics.js"></script>
<script src="jszip.min.js"></script>
<script src="grievance.js"></script>
<script src="board-names.js"></script>
<script>
// ⚙ Settings (owner, 2026-10-26): the page style, kept on this phone.
(() => {
  const gear = document.getElementById('gear');
  const box = document.getElementById('settings');
  const note = document.getElementById('stynote');
  const COLORS = { light: '#0f5c63', dark: '#12191b', retro: '#f1f1f1', tablet: '#000000' };
  const picked = () => { try { return localStorage.getItem('boardTheme') || ''; } catch (e) { return ''; } };
  function apply(t) {
    if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    const now = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', COLORS[now]);
    box.querySelectorAll('button.sty').forEach((b) => b.setAttribute('aria-pressed', b.dataset.theme === now));
    note.innerHTML = t ? 'Kept on this phone. <button type="button" id="styauto">Follow the phone\'s setting instead</button>' : 'Following the phone\'s light or dark setting. Pick one to keep it.';
    const auto = document.getElementById('styauto');
    if (auto) auto.onclick = () => { try { localStorage.removeItem('boardTheme'); } catch (e) { /* storage off */ } apply(''); };
  }
  box.querySelectorAll('button.sty').forEach((b) => { b.onclick = () => { try { localStorage.setItem('boardTheme', b.dataset.theme); } catch (e) { /* storage off */ } apply(b.dataset.theme); }; });
  const open = (yes) => { box.hidden = !yes; gear.setAttribute('aria-expanded', yes); };
  gear.onclick = (e) => { e.stopPropagation(); open(box.hidden); };
  document.addEventListener('click', (e) => { if (!box.hidden && !box.contains(e.target) && e.target !== gear) open(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !box.hidden) { open(false); gear.focus(); } });
  apply(picked());
})();

let focus = ''; // the turn open on the Turn History tab, e.g. "SR03"
// Turns picked out on the page: the tracked turns on Current and Snapshots,
// the Turn History turn there (owner, 2026-10-24: track several at once).
let marks = [];
const marked = (turn) => !!turn && marks.includes(turn);
const markedIn = (text) => marks.some((m) => BoardTurns.turnIn(text, m));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Tapping a screen chip jumps to where that screen shows (owner, 2026-10-23):
// the section's id, and for a pool screen which pool tab to open.
const JUMPS = { callBoard: { id: 'sec-callboard' }, chainGang: { id: 'sec-pools', pool: 'Chain Gang' }, aPool: { id: 'sec-pools', pool: 'A pool' },
  bPool: { id: 'sec-pools', pool: 'B pool' }, sdPool: { id: 'sec-pools', pool: 'SD' }, s1Pool: { id: 'sec-pools', pool: 'S1' }, s3Pool: { id: 'sec-pools', pool: 'S3' },
  lineup: { id: 'sec-lineup' }, bunkhouse: { id: 'sec-toronto' }, macLineup: { id: 'sec-toronto' },
  coFast: { id: 'sec-pools', pool: 'Conductor fast' }, coSlow: { id: 'sec-pools', pool: 'Conductor slow' }, enFast: { id: 'sec-pools', pool: 'Engineer fast' },
  enSlow: { id: 'sec-pools', pool: 'Engineer slow' }, s5Pool: { id: 'sec-pools', pool: '501/502' }, garnet: { id: 'sec-pools', pool: 'Garnet' },
  yardJobs: { id: 'sec-yard' }, terminal: { id: 'sec-vacancies' } };
const SCREENS = { chainGang: 'Chain Gang 23', aPool: 'A pool 19', bPool: 'B pool 21', sdPool: 'SD 27', s1Pool: 'S1 25', s3Pool: 'S3 26', lineup: 'Line-up 41', bunkhouse: 'Bunkhouse 28', macLineup: 'Toronto line-up 41',
  coFast: 'Conductor fast 13', coSlow: 'Conductor slow 9', enFast: 'Engineer fast 19', enSlow: 'Engineer slow 17', terminal: 'Jobs going spare 5',
  s5Pool: '501/502 29', garnet: 'Garnet 31', yardJobs: 'Yard jobs' };

// "2026-10-15 0815" → parts for display.
function when(taken) {
  const [d, t] = taken.split(' ');
  const date = new Date(d + 'T12:00:00Z');
  const opt = (o) => date.toLocaleDateString('en-CA', { ...o, timeZone: 'UTC' });
  return { day: opt({ weekday: 'short', month: 'short', day: 'numeric' }), long: opt({ weekday: 'long', month: 'long', day: 'numeric' }), time: `${t.slice(0, 2)}:${t.slice(2)}` };
}
const slug = (taken) => taken.replace(' ', '-');
// Minutes since a "2026-10-21 0357" stamp (railway/Toronto time), whatever
// zone the phone is in.
const stampMin = (st) => Date.UTC(+st.slice(0, 4), +st.slice(5, 7) - 1, +st.slice(8, 10), +st.slice(11, 13), +st.slice(13, 15)) / 60000;
function torontoNowMin() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Toronto', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
    .formatToParts(new Date()).map((x) => [x.type, +x.value]));
  return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute) / 60000;
}
function ageText(st) {
  const m = Math.max(0, torontoNowMin() - stampMin(st));
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  if (m < 48 * 60) return `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')} m ago`;
  return `${Math.floor(m / 1440)} days ago`;
}
// Keeps every age on the page ticking.
function tickAges() {
  document.querySelectorAll('[data-age]').forEach((el) => {
    const m = torontoNowMin() - stampMin(el.dataset.age);
    el.textContent = `${el.dataset.prefix || ''}${ageText(el.dataset.age)}`;
    const bar = el.closest('.agebar');
    if (bar && bar.dataset.live) { bar.classList.toggle('old', m >= 20 && m < 60); bar.classList.toggle('stale', m >= 60); }
  });
}
setInterval(tickAges, 30000);
// "15th 1100" → ["15th", "1100"]
const split = (s) => s.split(' ');

function poolChip(rules) {
  const m = /^(A|B) pool/.exec(rules) || (/^(Chain Gang|spareboard \(no Chain Gang)/.test(rules) ? [0, 'SR'] : /^S5/.test(rules) ? [0, 'S5'] : null);
  return m ? `<span class="pool ${m[1]}">${m[1]}</span>` : '';
}
// The marked turns, picked out in a line of text.
function markTurn(text) {
  const safe = esc(text);
  const ids = marks.filter((m) => /^[A-Z0-9]+$/.test(m));
  return ids.length ? safe.replace(new RegExp(`(^|[^A-Z0-9])(${ids.join('|')})(?=[^A-Z0-9]|$)`, 'g'), '$1<mark class="t">$2</mark>') : safe;
}
function ruleText(rules) {
  // No turn free, conductor or engineer: still an SR train with its chip,
  // said as just "spare" (owner, 2026-10-25). A turn going spare is "(spare)".
  return markTurn(rules.replace(/^(A|B) pool: /, '').replace(/^Chain Gang: /, '').replace(/^S5: /, '').replace(/^spareboard \(no Chain Gang turn free\)/, 'ENGSPARE')
    .replace(/spareboard \(no (SD|S1|S3) turn free\)/, 'ENGSPARE'))
    .replace(/\(goes spare[^)]*\)/g, '<span class="spare">(spare)</span>')
    .replace(/ENGSPARE/g, '<span class="spare">spare</span>');
}

function lineup(s) {
  if (!s.lineup.length) return '';
  let day = null;
  const rows = s.lineup.map((t) => {
    const [d, hhmm] = split(t.order);
    const bar = d !== day ? `<div class="daybar">${esc(d)}</div>` : '';
    day = d;
    const [sym, od] = split(t.train);
    const hit = markedIn(t.rules);
    return `${bar}<div class="train${hit ? ' hit' : ''}">
      <div class="time">${esc(hhmm)}</div>
      <div><div class="sym">${esc(sym)} <span class="od">${esc(od)}</span>${t.deadhead ? ' <span class="chip">DH</span>' : ''}</div>
        <div class="sub">${esc(t.info)} · <span class="mono">${esc(t.engCrew)} / ${esc(t.trnCrew)}</span></div></div>
      <div class="right"><span class="st ${t.status}">${esc(t.status)}</span>${t.call ? `<span class="sub mono">call ~${esc(split(t.call)[1])}</span>` : ''}</div>
      <div class="rule-say">${poolChip(t.rules)}<span>${ruleText(t.rules)}</span>
        ${t.reason ? `<details class="why"><summary>Why</summary><p>${esc(t.reason)}</p></details>` : ''}</div>
    </div>`;
  }).join('');
  const ord = s.lineup.filter((t) => t.status === 'ORD').length;
  return `<section class="sheet" id="sec-lineup"><header><h2>Train line-up · 41</h2><span class="meta">${s.lineup.length} trains · ${ord} ordered</span></header>
    ${rows}<div class="foot">Crew codes are EN / TRN as CATS shows them. The coloured chip is the pool the crew-calling rules give the train.</div></section>`;
}

// Toronto (Mac yard): the westbound line-up with the bunkhouse crew predicted
// for each train, first crew home on the first train (owner, 2026-10-17),
// skipping crews still on rest at the call (owner, 2026-10-22).
function toronto(s) {
  const trains = s.macLineup || [];
  const crews = s.bunkhouse || [];
  // Say so when a Toronto screen wasn't read, so an empty table isn't taken
  // for "no trains" or "no crews".
  const readB = (s.screens || []).includes('bunkhouse');
  const readM = (s.screens || []).includes('macLineup');
  if (!readB && !readM) {
    return `<section class="sheet" id="sec-toronto"><header><h2>Toronto line-up · Mac yard</h2></header>
      <p class="empty">The Toronto screens (bunkhouse 28 and the Mac yard line-up 41) weren't read in this check.</p></section>`;
  }
  const missing = !readB ? 'The bunkhouse (28) wasn\'t read in this check, so no crews are shown.'
    : !readM ? 'The Mac yard line-up (41) wasn\'t read in this check, so no trains are shown.' : '';
  const byPos = new Map(crews.map((c) => [c.pos, c]));
  const crewCell = (c, t) => {
    const skip = t.skipped && t.skipped.length ? `<div class="crew chg">skipped, on rest at the call: ${t.skipped.map(esc).join(' · ')}</div>` : '';
    // Ordered out of the bunkhouse with no crew rested by the call: it doesn't
    // go spare like in Sarnia; a Toronto South crew may get it (owner, 2026-10-25).
    if (!c && t.status === 'ORD' && !t.deadhead) return `<span class="spare">possible Toronto South crew</span><div class="crew">no rested crew in the bunkhouse by the call${t.south ? `; first in line: <b>${markTurn(t.south.crew)}</b>${t.south.rested ? ` (rest until ${esc(t.south.rested)})` : ''}` : ''}</div>`;
    if (!c) return `<span class="muted">${t.skipped && t.skipped.length ? 'no rested crew in the bunkhouse by the call' : 'no crew in the bunkhouse yet'}</span>${skip}`;
    // Planned and still on rest at the call (owner, 2026-10-25): when they're rested, in yellow.
    const when = c.ready ? '<span class="ok">rested</span>' : t.restedLate ? `<span class="spare">rested ${esc(t.restedLate)}</span>` : `rest until ${esc(c.rested)}`;
    return `<b class="num">${markTurn([c.en, c.co].filter(Boolean).join(' + '))}</b>
      <div class="crew">pos ${esc(c.pos)} · ${when}${c.offDuty ? ` · off duty ${esc(c.offDuty)}` : ''}${t.call ? ` · call ~${esc(t.call)}` : ''}</div>${skip}`;
  };
  // A crew not in the bunkhouse yet (owner, 2026-10-22): an estimate from
  // when it went on duty in Sarnia (train ~8 h, deadhead ~3 h, then 8 h rest).
  const expectedCell = (t) => {
    const x = t.crewExpected;
    const skip = t.skipped && t.skipped.length ? `<div class="crew chg">skipped, on rest at the call: ${t.skipped.map(esc).join(' · ')}</div>` : '';
    return `<b class="num">${markTurn(t.crew)}</b> <span class="chip">estimate</span>
      <div class="crew">on the way: on duty Sarnia ${esc(x.onDuty)} on ${esc(x.train)} · in Toronto ~${esc(x.offDuty)} · rested ~${esc(x.rested)}${t.call ? ` · call ~${esc(t.call)}` : ''}</div>${skip}`;
  };
  const rows = trains.map((t) => {
    if (t.crewExpected) {
      const hit = t.crew.split(' + ').some(marked);
      return `<tr${hit ? ' class="hit"' : ''}><td class="num">${esc(t.order)}</td><td><span class="st ${t.status}">${esc(t.status)}</span></td>
      <td><b class="num">${esc(t.train)}</b><div class="crew">${esc(t.info)} · from ${esc(t.orstn)}</div></td><td>${expectedCell(t)}</td></tr>`;
    }
    const c = byPos.get(t.crewPos);
    const hit = c && (marked(c.en) || marked(c.co));
    return `<tr${hit ? ' class="hit"' : ''}><td class="num">${esc(t.order)}</td><td><span class="st ${t.status}">${esc(t.status)}</span></td>
      <td><b class="num">${esc(t.train)}</b><div class="crew">${esc(t.info)} · from ${esc(t.orstn)}</div></td><td>${crewCell(c, t)}</td></tr>`;
  }).join('');
  const taken = new Set(trains.map((t) => t.crewPos).filter(Boolean));
  const extra = crews.filter((c) => !taken.has(c.pos));
  const left = extra.length ? `<div class="foot">Also in the bunkhouse, no train yet: ${extra.map((c) => `${esc(c.pos)} ${markTurn([c.en, c.co].filter(Boolean).join(' + '))}${c.ready ? ' (rested)' : ` (rest until ${esc(c.rested)})`}`).join(' · ')}</div>` : '';
  const placed = new Set(trains.filter((t) => t.crewExpected).map((t) => t.crew));
  const coming = (s.onTheWay || []).filter((c) => !placed.has(c.crew));
  const way = coming.length ? `<div class="foot">On the way, no Toronto train for them yet (estimates): ${coming.map((c) => `${markTurn(c.crew)} (${esc(c.train)}, in Toronto ~${esc(c.offDuty)}, rested ~${esc(c.rested)})`).join(' · ')}</div>` : '';
  return `<section class="sheet" id="sec-toronto"><header><h2>Toronto line-up · Mac yard</h2><span class="meta">${trains.length} trains · ${crews.length} crews in the bunkhouse</span></header>
    <div class="scroll"><table><thead><tr><th>Order</th><th></th><th>Train</th><th>Predicted crew (bunkhouse order)</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="muted">No trains on the Toronto line-up.</td></tr>'}</tbody></table></div>
    ${missing ? `<div class="foot bad">${missing}</div>` : ''}${left}${way}<div class="foot">Crews take these trains in bunkhouse order (option 28): first crew home, first train. After the bunkhouse come the crews still on their way (marked <span class="chip">estimate</span>): each Sarnia train on duty on the Call Board is guessed to tie up in Toronto about 8 h after going on duty (a deadhead about 3 h), and to be rested 8 h after that. A <b>planned</b> train stays with the next crew in line; if it's still on rest at the call, when it's rested shows in yellow. An <b>ordered</b> train goes to the next crew rested by the call (2 h before on duty); one still on rest is skipped and keeps its place. Ordered with no rested crew: possibly a Toronto South crew. Off duty = rest − 8 h.</div></section>`;
}

function dot(status) {
  if (/out working/.test(status)) return 'out';
  if (/spare|B0/.test(status)) return 'spare';
  if (/rest|hold/.test(status)) return 'wait';
  return '';
}
function pools(s, pi) {
  if (!s.pools.length) return '';
  const p = s.pools[pi] || s.pools[0];
  const tabs = s.pools.map((q, i) => `<button role="tab" aria-selected="${q === p}" data-pool="${i}">${esc(q.name.replace(' · conductors', '').replace(' · engineers', ''))}</button>`).join('');
  const rows = p.turns.map((t) => `<tr${marked(t.turn) ? ' class="hit"' : ''}><td class="num">${esc(t.pos)}</td><td class="num"><b>${esc(t.turn)}</b>${t.viewTime ? ` <span class="vt">${esc(t.viewTime)}</span>` : ''}${t.craft ? ` <span class="chip">${esc(t.craft)}</span>` : ''}</td>
    <td><span class="stat-dot ${dot(t.status)}"></span>${esc(t.status)}</td></tr>`).join('');
  const away = /Chain Gang/.test(p.name) && (s.returning.length || s.away.length)
    ? `<div class="away">${s.returning.length ? `<div><b>Coming home</b> ${markTurn(s.returning.join(', '))}</div>` : ''}${s.away.length ? `<div><b>In Toronto</b> ${markTurn(s.away.join(', '))}</div>` : ''}</div>` : '';
  // Spareboards (owner, 2026-10-28): anyone who only shows with VIEW TIME
  // (the check less 10 min) has that time in yellow beside their turn.
  const left = p.turns.some((t) => t.left) ? `<p class="anote" style="margin:10px 14px">A <span class="vt">${esc(p.viewTime || '')}</span> beside a turn: only on the board with VIEW TIME ${esc(p.viewTime || '')}.</p>` : '';
  return `<section class="sheet" id="sec-pools"><header><h2>Pools at Sarnia</h2><span class="meta">${p.turns.length} turns</span></header>
    <div class="tabs" role="tablist">${tabs}</div>
    <table><thead><tr><th>Pos</th><th>Turn</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>${away}${left}</section>`;
}

function onDuty(s) {
  if (!s.onDuty.length) return '';
  const rows = s.onDuty.map((t) => `<tr${markedIn(t.crew) || (t.backfill || []).some((b) => marked(b.turn)) ? ' class="hit"' : ''}><td class="num">${esc(t.onDuty)}</td><td>${esc(t.station.charAt(0) + t.station.slice(1).toLowerCase())}</td>
    <td><b class="num">${esc(t.train)}</b><div class="crew mono">${markTurn(t.crew)}</div>${(t.backfill || []).length ? `<div class="crew">${markTurn(t.backfill.map((b) => `${b.turn} filling in on ${b.job}`).join(' · '))}</div>` : ''}</td></tr>`).join('');
  return `<section class="sheet" id="sec-callboard"><header><h2>Call board · on duty</h2><span class="meta">${s.onDuty.length} trains</span></header>
    <div class="scroll"><table><thead><tr><th>On duty</th><th>At</th><th>Train · crew</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

// Yard jobs on duty (owner, 2026-10-24), taken as 8 h long.
function yardJobs(s) {
  if (!(s.yardJobs || []).length) return '';
  const rows = s.yardJobs.map((j) => `<tr${marked(j.job) || markedIn(j.crew) ? ' class="hit"' : ''}><td class="num">${esc(j.onDuty || '—')}</td>
    <td><b class="num">${markTurn(j.job)}</b><div class="crew mono">${markTurn(j.crew)}</div></td><td class="num">${j.off ? `~${esc(j.off)}` : '—'}</td></tr>`).join('');
  return `<section class="sheet" id="sec-yard"><header><h2>Yard jobs · on duty</h2><span class="meta">${s.yardJobs.length} jobs</span></header>
    <div class="scroll"><table><thead><tr><th>On duty</th><th>Job · crew</th><th>Off</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="foot">Off duty is a guess: 8 h after on duty.</div></section>`;
}

// The jobs going spare: the terminal line-up, vacancies only (option 5).
function vacancies(s) {
  if (!(s.vacancies || []).length) return '';
  // The spare turn predicted to fill it (owner, 2026-10-24: yard jobs off
  // the fast board, road jobs off the slow board, in board order).
  const fill = (v) => (!v.fill ? ''
    : `<div class="crew">Filled by ${v.fill.turn ? `<b class="num">${markTurn(v.fill.turn)}</b> <span class="chip">estimate</span>` : '<span class="spare">no one free</span>'} · ${esc(v.fill.board)} · call ~${esc(v.fill.call)}${skippedText(v.fill.skipped)}${v.fill.sd ? ` · <b class="num">${markTurn(v.fill.sd)}</b> (Chain Gang) may be called` : ''}</div>`);
  // Short: the B0s counted, the rest named (owner, 2026-10-26: a long list of B0s).
  function skippedText(list) {
    if (!list || !list.length) return '';
    const b0 = list.filter((x) => /\(B0/.test(x));
    const rest = list.filter((x) => !/\(B0/.test(x));
    const parts = [...rest, ...(b0.length ? [`${b0.length} on B0 (working)`] : [])];
    return ` · skipped: ${esc(parts.join(' · '))}`;
  }
  const rows = s.vacancies.map((v) => `<tr${marked(v.turn) || (v.fill && marked(v.fill.turn)) ? ' class="hit"' : ''}><td class="num">${esc(v.at)}</td>
    <td><b class="num">${esc(v.train)}</b><div class="crew">${esc(v.pool)} ${esc(v.cc)} · ${v.status === 'ORDERED' ? 'ordered' : 'planned'}</div>${fill(v)}</td>
    <td class="num">${markTurn(v.turn)}${v.pool === 'S5' ? ` <span class="chip">${esc(v.cc === 'EN' ? 'EN' : 'CO')}</span>` : ''} <span class="spare">(spare)</span>${v.cats ? `<div class="crew">CATS lists ${esc(v.cats)}</div>` : ''}${v.returns ? `<div class="crew">returns ${esc(v.returns)}</div>` : ''}</td></tr>`).join('');
  return `<section class="sheet" id="sec-vacancies"><header><h2>Jobs going spare · 5</h2><span class="meta">${s.vacancies.length} jobs</span></header>
    <div class="scroll"><table><thead><tr><th>Time</th><th>Job · filled by</th><th>Turn</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="foot">"Filled by" is a guess: yard jobs come off the fast board, road jobs off the slow board (engineer jobs off the engineer boards), in board order, earliest job first. A spare still on rest or a hold turn at the call, or B0 (working another job), is skipped and keeps its place. Calls: 2 h before a yard job or a deadhead; order − 2 h 15 m for a train.</div></section>`;
}

function sequence(s) {
  if (!s.sequence.length) return '';
  const rows = s.sequence.map((t) => {
    const off = t.actual && t.actual !== t.expected && t.actual !== 'MU';
    return `<tr${marked(t.turn) ? ' class="hit"' : ''}><td class="num">${esc(t.order)}</td><td class="num"><b>${esc(t.train)}</b></td><td class="num">${esc(t.turn || '–')}</td>
      <td>${off ? `<span class="bad">${esc(t.actual)}, should be ${esc(t.expected)}</span>` : `<span class="ok">${esc(t.expected)} ✓</span>`}</td></tr>`;
  }).join('');
  return `<section class="sheet"><header><h2>Calling sequence</h2><span class="meta">Sarnia departures</span></header>
    <div class="scroll"><table><thead><tr><th>Order</th><th>Train</th><th>Turn</th><th>Pool</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="foot">Order time is on duty plus prep. First 3 trains after 0459 go to A, next 2 to B, the rest and deadheads to the Chain Gang.</div></section>`;
}

function changes(s) {
  if (!s.changes) return `<section class="sheet"><header><h2>Changes</h2></header><p class="empty">First snapshot. Nothing earlier to compare.</p></section>`;
  const w = when(s.prevTaken);
  const head = `<header><h2>Changes</h2><span class="meta">since ${esc(w.day)} ${esc(w.time)}</span></header>`;
  if (!s.changes.length) return `<section class="sheet">${head}<p class="empty">No changes.</p></section>`;
  const items = s.changes.map((l) => {
    const g = l.charAt(0);
    const cls = g === '+' ? 'add' : g === '-' ? 'del' : 'mod';
    return `<li class="${cls}"><span class="g">${esc(g === '~' ? '→' : g === '-' ? '−' : g)}</span><span>${esc(l.slice(2))}</span></li>`;
  }).join('');
  return `<section class="sheet">${head}<ul class="changes">${items}</ul></section>`;
}

function flags(s) {
  if (!s.flags.length) return '';
  return `<section class="sheet"><header><h2>To check</h2><span class="meta">possible problems</span></header>
    <ul class="flags">${s.flags.map((f) => `<li>${esc(f)}</li>`).join('')}</ul></section>`;
}

function strip(s) {
  const ord = s.lineup.filter((t) => t.status === 'ORD').length;
  // From the spareboards, fast and slow together (owner, 2026-10-24):
  // available to work now / on the board. — when the boards weren't read.
  const spare = (craft) => {
    const turns = new Map();
    for (const p of s.pools.filter((q) => q.name.startsWith(`${craft} fast board`) || q.name.startsWith(`${craft} slow board`))) {
      for (const t of p.turns) turns.set(t.turn, t);
    }
    if (!turns.size) return '—';
    const free = [...turns.values()].filter((t) => t.status === 'available').length;
    return `${free} <small>/ ${turns.size}</small>`;
  };
  return `<div class="strip three">
    <div class="stat"><div class="v">${s.lineup.length} <small>/ ${ord} ORD</small></div><div class="l">Trains on the line-up</div></div>
    <div class="stat"><div class="v">${spare('Conductor')}</div><div class="l">Conductors available (spareboard)</div></div>
    <div class="stat"><div class="v">${spare('Engineer')}</div><div class="l">Engineers available (spareboard)</div></div>
  </div>`;
}

const getJSON = (url) => fetch(url, { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error(`${url}: ${r.status}`); return r.json(); });

// Live site: data/index.json lists the days, data/<day>.json holds each day's
// snapshots. Without it (the sample page) everything comes from board-sample.json.
const once = (fn) => { let p = null; return () => p || (p = fn()); };

// The turn panel: where the turn is in this snapshot, and its history (each
// time what the board said about it changed). History fills in once loaded.
const KIND = { pool: 'Pool', away: 'Away', returning: 'Returning', lineup: 'Line-up', onDuty: 'On duty', sequence: 'Called', bunkhouse: 'Bunkhouse', homeTrain: 'Going home', spareJob: 'Spare', spareFill: 'Spare call', mayCall: 'May call' };
function turnPanel(s) {
  const f = BoardTurns.facts(s, focus);
  const here = f.length
    ? `<ul>${f.map((x) => `<li><span class="kind">${KIND[x.kind]}</span><span>${markTurn(x.text)}</span></li>`).join('')}</ul>`
    : '<p class="empty" style="padding:0">Not on any screen in this check.</p>';
  return `<section class="sheet turnpanel"><header><h2>Turn <span class="num">${esc(focus)}</span></h2><div class="hbtns"><button id="turnalert" type="button">🔔 Track / alerts</button></div></header>
    <div id="whengo" class="whengo" hidden></div>
    <div id="alertnote" class="alertnote" hidden></div>
    <div id="worklog" class="work"></div>
    <div class="tp"><div><h3>Now <span class="muted">(${esc(when(s.taken).time)} check)</span></h3>${here}</div>
    <div><h3>Changes <span class="muted">(that lasted 30 m or more)</span></h3><div id="turnhist" class="hist"><p class="empty" style="padding:0">Loading…</p></div></div></div>
    <div class="tp tp3" id="turnmore"></div></section>`;
}
// A time that opens that snapshot.
const stampBtn = (taken) => { const w = when(taken); return `<button type="button" data-taken="${esc(taken)}">${esc(w.day.replace(/^\w+, /, ''))} ${esc(w.time)}</button>`; };
// A person's history (hidden search): each turn's history, only while they
// were on it, put together and marked with the turn.
function personHistory(stretches, all) {
  const within = (t, e) => t && t >= e.from && t <= e.to;
  const rec = { changes: [], orders: [], rests: [], spares: [] };
  for (const e of stretches) {
    const r = all[e.turn];
    if (!r) continue;
    const tag = (x) => ({ ...x, turn: e.turn });
    rec.changes.push(...r.changes.filter((c) => within(c.taken, e)).map(tag));
    rec.orders.push(...r.orders.filter((o) => within(o.first, e) || within(o.last, e) || within(o.onDutySeen, e)).map(tag));
    rec.rests.push(...r.rests.filter((x) => within(x.seen, e)).map(tag));
    rec.spares.push(...r.spares.filter((x) => within(x.seen, e) || within(x.last, e)).map(tag));
  }
  const by = (k) => (a, b) => (a[k] < b[k] ? -1 : a[k] > b[k] ? 1 : 0);
  rec.changes.sort(by('taken'));
  rec.orders.sort(by('first'));
  rec.rests.sort(by('seen'));
  rec.spares.sort(by('seen'));
  rec.changes = rec.changes.map((c) => ({ ...c, text: `${c.turn}: ${c.text}` }));
  rec.orders = rec.orders.filter((o, i, a) => a.findIndex((x) => x.train === o.train) === i).map((o) => ({ ...o, train: `${o.train} (${o.turn})` }));
  rec.rests = rec.rests.map((x) => ({ ...x, where: [x.turn, x.where].filter(Boolean).join(', ') }));
  rec.spares = rec.spares.map((x) => ({ ...x, text: `${x.turn}: ${x.text}` }));
  return rec;
}

// Work history (owner, 2026-10-25): the trains and yard jobs this turn
// actually worked (on duty on the Call Board; not ones someone else worked
// for it), newest first: call (2 h before on duty), on duty, train, who they
// worked with. Each opens the call history leading up to it: everything the
// board said about the turn since the train before.
const callBefore = (stamp, mins) => {
  if (!stamp) return '';
  const d = new Date(Date.UTC(+stamp.slice(0, 4), +stamp.slice(5, 7) - 1, +stamp.slice(8, 10), +stamp.slice(11, 13), +stamp.slice(13, 15)) - mins * 60000);
  return d.toISOString().slice(0, 10) + ' ' + d.toISOString().slice(11, 13) + d.toISOString().slice(14, 16);
};
function worked(rec, turn = '') {
  // "S501-CO": only trains with that craft on that turn (owner, 2026-10-25).
  const { base, craft } = BoardTurns.splitCraft(turn);
  return (rec ? rec.orders : []).filter((o) => o.onDuty && !o.workedBy && (!craft || !o.crew || BoardTurns.crewHasCraft(o.crew, base, craft)))
    .map((o) => ({ ...o, at: BoardTrains.resolve(o.onDutyAt, o.onDutySeen) || o.onDutySeen }))
    .sort((a, b) => (a.at < b.at ? 1 : -1));
}
function workHistory(rec, turnIn) {
  const rows = worked(rec, turnIn);
  const turn = BoardTurns.splitCraft(turnIn).base;
  if (!rows.length) return '<h3>Work history</h3><p class="empty" style="padding:0 14px 10px">No trains worked in the saved checks.</p>';
  const partners = (o) => (o.crew || '').split(' · ').filter(Boolean).filter((c) => { const t = c.split(' ').pop(); return t !== turn && t !== o.job && t !== o.turn; });
  // Rest (or a hold turn) between two trains worked (owner, 2026-10-25): the
  // rests first seen after the train before and up to this one, shown as a
  // line between them.
  // Newest first, so the rest before a train shows just below it; any rest
  // since the latest train, at the top.
  const restLine = (from, to, lbl) => {
    const r = (rec.rests || []).filter((x) => x.seen > from && (!to || x.seen <= to));
    return r.length ? `<tr class="wrest"><td colspan="3"><span class="muted">${lbl}</span> ${r.map((x) => `${esc(x.kind)} until <b>${esc(x.until)}</b>${x.where ? ` <span class="muted">(${esc(x.where)})</span>` : ''}`).join(' · ')}</td></tr>` : '';
  };
  const restBefore = (i) => restLine(rows[i + 1] ? rows[i + 1].onDutySeen : '', rows[i].onDutySeen, 'Rest before it:');
  const body = restLine(rows[0].onDutySeen, '', 'Since then:') + rows.map((o, i) => `<tr class="wrow" data-w="${i}"><td class="num">${esc(dt(callBefore(o.at, 120)))}<div class="crew">on duty ${esc(dt(o.at).split(' ')[1] || '')}</div></td>
    <td><b class="num">${esc(o.train)}</b>${o.yard ? ' <span class="chip">yard</span>' : ''}${o.job ? `<div class="crew">working ${esc(o.job)}</div>` : ''}${o.station && !/^SARNIA$/i.test(o.station) ? `<div class="crew">at ${esc(o.station.charAt(0) + o.station.slice(1).toLowerCase())}</div>` : ''}</td>
    <td class="num">${partners(o).map((c) => markTurn(c)).join('<br>') || '—'}</td></tr>` + restBefore(i)).join('');
  return `<h3>Work history <span class="muted">(tap a train for its call history)</span></h3>
    <div class="scroll"><table><thead><tr><th>Call</th><th>Train</th><th>Worked with</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
// What happened to the turn from the train before (exclusive) up to this one.
function callHistory(rec, rows, i) {
  const o = rows[i];
  const prev = rows[i + 1] ? rows[i + 1].onDutySeen : '';
  const inWin = (t) => t && t > prev && t <= o.onDutySeen;
  const items = [
    ...rec.changes.filter((c) => inWin(c.taken)).map((c) => ({ taken: c.taken, text: c.text })),
    ...rec.rests.filter((r) => inWin(r.seen)).map((r) => ({ taken: r.seen, text: `${r.kind} until ${r.until}${r.where ? ` (${r.where})` : ''}` })),
  ].sort((a, b) => (a.taken < b.taken ? -1 : a.taken > b.taken ? 1 : 0));
  const head = [o.projected && `Projected: ${o.projected}`, o.called && `Called: ${o.called}`, `On duty ${o.onDuty}`].filter(Boolean);
  return `<h4>${esc(o.train)}: ${head.map(esc).join(' · ')}</h4>${items.length
    ? `<ul>${items.map((x) => `<li>${stampBtn(x.taken)}<span>${markTurn(x.text)}</span></li>`).join('')}</ul>`
    : '<p class="empty" style="padding:0">Nothing else recorded before it in the saved checks.</p>'}`;
}
function wireWork(box, rec, turn) {
  const rows = worked(rec, turn);
  box.querySelectorAll('tr.wrow').forEach((tr) => {
    tr.onclick = () => {
      const open = tr.classList.contains('open');
      box.querySelectorAll('tr.wrow.open').forEach((x) => x.classList.remove('open'));
      box.querySelectorAll('tr.wdet').forEach((x) => x.remove());
      if (open) return;
      tr.classList.add('open');
      const d = document.createElement('tr');
      d.className = 'wdet';
      d.innerHTML = `<td colspan="3" class="det">${callHistory(rec, rows, +tr.dataset.w)}</td>`;
      tr.after(d);
      d.querySelectorAll('button[data-taken]').forEach((b) => { b.onclick = (e) => { e.stopPropagation(); window.dispatchEvent(new CustomEvent('jumpto', { detail: b.dataset.taken })); }; });
    };
  });
}

// The turn's history (BoardTurns.finish): changes, then orders, rest and
// spare, newest first. `current` marks the change in force at this snapshot.
function turnHistory(rec, current) {
  const none = (what) => `<p class="empty" style="padding:0">${what}</p>`;
  if (!rec || !rec.changes.length) return { changes: none('No history for this turn in the saved checks.'), more: '' };
  let nowIdx = -1;
  rec.changes.forEach((e, i) => { if (e.taken <= current) nowIdx = i; });
  const changes = `<ul>${rec.changes.map((e, i) => [e, i]).reverse().map(([e, i]) =>
    `<li class="${i === nowIdx ? 'now' : ''}">${stampBtn(e.taken)}<span>${markTurn(e.text)}</span></li>`).join('')}</ul>`;
  const orders = rec.orders.length ? `<ul>${[...rec.orders].reverse().map((o) => `<li>${stampBtn(o.first)}<span><b class="num">${esc(o.train)}</b>${
    o.projected ? `<br>Projected: ${markTurn(o.projected)}` : ''}${o.called ? `<br>Called: ${esc(o.called)}` : ''}${
    o.onDuty ? `<br><b>On duty</b> ${esc(o.onDuty)}` : ''}</span></li>`).join('')}</ul>` : none('No trains for this turn in the saved checks.');
  const rests = rec.rests.length ? `<ul>${[...rec.rests].reverse().map((r) => `<li>${stampBtn(r.seen)}<span>${esc(r.kind)} until <b>${esc(r.until)}</b>${r.where ? ` <span class="muted">(${esc(r.where)})</span>` : ''}</span></li>`).join('')}</ul>`
    : none('No rest or hold turn in the saved checks.');
  const spares = rec.spares.length ? `<ul>${[...rec.spares].reverse().map((x) => `<li>${stampBtn(x.seen)}<span class="spare">Goes spare</span><span style="grid-column:2">${markTurn(x.text)}${x.last !== x.seen ? ` <span class="muted">(until ${esc(when(x.last).time)}${x.last.slice(0, 10) !== x.seen.slice(0, 10) ? ` ${esc(when(x.last).day)}` : ''})</span>` : ''}</span></li>`).join('')}</ul>`
    : none('Never went spare in the saved checks.');
  return { changes, more: `<div><h3>Orders</h3><div class="hist">${orders}</div></div><div><h3>Rest</h3><div class="hist">${rests}</div></div><div><h3>Goes spare</h3><div class="hist">${spares}</div></div>` };
}

// --- Order summary ---------------------------------------------------------

// "2026-10-17 0815" → "17th 0815"
function dt(stamp) {
  if (!stamp) return '—';
  const d = +stamp.slice(8, 10);
  const suf = d >= 11 && d <= 13 ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[d % 10] || 'th');
  return `${d}${suf} ${stamp.slice(11)}`;
}
function dur(min) {
  const a = Math.abs(min);
  const h = Math.floor(a / 60);
  const m = a % 60;
  return h ? `${h} h ${String(m).padStart(2, '0')} m` : `${m} m`;
}
const ON_TIME = 15; // within this many minutes counts as on time
// Colour by how far off, early or late alike (owner, 2026-10-17): under
// 30 m green, 30 m to 1 h 56 m yellow, more than that red.
const OFF_YELLOW = 30;
const OFF_RED = 116;
function offCell(min) {
  if (min == null) return '<span class="offv none">—</span>';
  const a = Math.abs(min);
  const band = a > OFF_RED ? 'bad' : a >= OFF_YELLOW ? 'warn' : 'ok';
  if (a <= ON_TIME) return `<span class="offv ok">on time${min ? ` (${min > 0 ? '+' : '−'}${dur(min)})` : ''}</span>`;
  return `<span class="offv ${band}">${dur(min)} ${min > 0 ? 'late' : 'early'}</span>`;
}

function story(r) {
  const line = (e) => {
    const time = `<button type="button" data-taken="${esc(e.taken)}" title="Open this snapshot">${esc(dt(e.taken))}</button>`;
    const t = {
      seen: () => `<span class="k">First on the line-up</span>, ${e.status} for ${esc(dt(e.at))}`,
      planChange: () => `Plan moved ${esc(dt(e.from))} → <b>${esc(dt(e.at))}</b> (${BoardTrains.off(e.from, e.at) > 0 ? '+' : '−'}${dur(BoardTrains.off(e.from, e.at))})`,
      ordered: () => `<span class="k">Ordered</span> for <b>${esc(dt(e.at))}</b>`,
      orderChange: () => `<span class="k chg">Order changed</span> ${esc(dt(e.from))} → <b>${esc(dt(e.at))}</b> (${BoardTrains.off(e.from, e.at) > 0 ? '+' : '−'}${dur(BoardTrains.off(e.from, e.at))})`,
      onDuty: () => `<span class="k">On duty</span> ${esc(dt(e.at))} (Call Board${e.crew ? `, ${esc(e.crew)}` : ''})`,
      onDutyChange: () => `On-duty time corrected ${esc(dt(e.from))} → ${esc(dt(e.at))}`,
      gone: () => 'Off the line-up without showing on the Call Board (cancelled, or on duty between checks)',
      offDuty: () => `<span class="k">Off duty in Toronto</span> ${esc(dt(e.at))} (${esc(e.crew)} in the bunkhouse; rest − 8 h)`,
      back: () => `Back on the line-up, ${e.status} for ${esc(dt(e.at))}`,
    }[e.kind];
    return `<li class="${/ordered|onDuty$|seen/.test(e.kind) ? 'big' : ''}">${time}<span>${t ? t() : esc(e.kind)}</span></li>`;
  };
  const sum = [];
  if (r.onDuty && r.firstPlan) sum.push(`First plan ${esc(dt(r.firstPlan))} → on duty ${esc(dt(r.onDuty))}: ${offCell(r.offPlan)}`);
  if (r.onDuty && r.firstOrder) sum.push(`First order ${esc(dt(r.firstOrder))} → on duty ${esc(dt(r.onDuty))}: ${offCell(r.offOrder)}`);
  if (!r.firstPlan && r.firstOrder) sum.push('Already ordered the first time it was seen, so there is no plan to compare.');
  if (r.onDuty && !r.firstOrder) sum.push('Never seen as ORD: it went from planned to on duty between two checks.');
  if (r.onDuty && r.leadMin != null) sum.push(`First seen ${dur(r.leadMin)} before going on duty.`);
  if (r.timeOnDuty != null) sum.push(`On duty ${esc(dt(r.onDuty))} → off duty in Toronto ${esc(dt(r.offDuty))}: <b>${dur(r.timeOnDuty)}</b> on duty.`);
  // Predicted crew vs who went (owner, 2026-10-22).
  if (r.predicted) {
    const p = r.predicted;
    const said = [p.en, p.co].filter(Boolean).join(' + ');
    const h = r.predHit;
    const mark = (ok) => (ok == null ? ' <span class="muted">(not predicted)</span>' : ok ? ' <span class="ok">✓</span>' : ' <span class="bad">✗</span>');
    sum.push(h ? `Predicted crew (as of ${esc(dt(p.taken))}): <b>${esc(said)}</b>; went: <b>${esc([h.actual.en, h.actual.co].filter(Boolean).join(' + ') || '—')}</b>. Conductor${mark(h.co)} · engineer${mark(h.en)}`
      : `Predicted crew (as of ${esc(dt(p.taken))}): <b>${esc(said)}</b>; not on duty yet.`);
  }
