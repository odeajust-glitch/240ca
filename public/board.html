  sum.push(`<button type="button" class="sharebtn" data-share="${esc(r.id)}">🔗 Share this train</button>`);
  if (r.flag === 'deadhead') sum.push(`<span class="chg">${esc(FLAG_TEXT.deadhead)}</span>: left the ${r.from === 'mac' ? 'Toronto' : 'Sarnia'} line-up and wasn't on the Call Board ${BoardTrains.FLAG_WAIT} minutes later.`);
  else if (r.flag) sum.push(`<span class="${r.flag === 'nonSarnia' ? 'bad' : 'chg'}">${esc(FLAG_TEXT[r.flag])}</span>: left the Toronto line-up and wasn't on the Call Board ${BoardTrains.FLAG_WAIT} minutes later; ${r.avail === 0 ? 'no rested Sarnia crew was in the bunkhouse' : r.avail == null ? 'the bunkhouse wasn\'t read' : `${r.avail} rested Sarnia crew${r.avail === 1 ? ' was' : 's were'} in the bunkhouse`}.`);
  return `<tr class="story"><td colspan="10"><ol>${r.events.map(line).join('')}</ol>${sum.length ? `<div class="sum">${sum.map((x) => `<div>${x}</div>`).join('')}</div>` : ''}</td></tr>`;
}

const FLAG_TEXT = { nonSarnia: 'Non-Sarnia Crew', possible: 'Possible Non-Sarnia Crew or Train Cancelled', deadhead: 'Deadhead never called' };
const FROM = { sarnia: 'Sarnia', mac: 'Toronto' };

// --- Analytics (owner, 2026-10-26) -----------------------------------------
// Numbers across the saved checks (and, from data/archive.json, from before
// the site's first day) for a train number (148 = every x148xx), a turn or a
// person's name code, from BoardAnalytics. The owner then picked: charts,
// time between trains, turns side by side, runarounds, jobs going spare,
// least reliable trains, never ran, prediction accuracy over time, a
// spreadsheet download and dates.
const pctOf = (x) => (x.n ? Math.round((100 * x.hit) / x.n) : null);
const anaTile = (v, l, alert) => `<div class="stat${alert ? ' alert' : ''}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
const durOr = (m) => (m == null ? '—' : esc(dur(m)));
function anaTiles(st, kind) {
  const tile = anaTile;
  const pct = (x) => (x.n ? `${pctOf(x)}% <small>${x.hit} / ${x.n}</small>` : '—');
  const t = st.time;
  const d = durOr;
  const first = kind === 'train'
    ? tile(`${st.ran} <small>/ ${st.seen}</small>`, 'Went on duty (of trains seen)')
    : tile(`${st.ran - st.yard}${st.yard ? ` <small>+ ${st.yard} yard</small>` : ''}`, 'Trains worked');
  const last = kind === 'train'
    ? tile(`${st.cancelled}${st.nonSarnia || st.possibleNonSarnia ? ` <small>+ ${st.nonSarnia + st.possibleNonSarnia} Toronto crew</small>` : ''}`,
      `Never ran: cancelled or on duty between checks${st.nonSarnia || st.possibleNonSarnia ? `; ${st.nonSarnia} went to a non-Sarnia crew${st.possibleNonSarnia ? `, ${st.possibleNonSarnia} possibly` : ''}` : ''}`, st.cancelled > 0)
    : tile(st.deadheads, 'Deadheads');
  return `<div class="strip">${first}
      ${tile(t ? `${t.from}–${t.to}` : '—', 'Usually on duty (middle half of the times)')}
      ${tile(t ? `${t.earliest}–${t.latest}` : '—', 'Earliest – latest on duty')}
      ${last}</div>
    <div class="strip">
      ${tile(d(st.timeOnDuty.avg), `Average time on duty, Sarnia to Toronto${st.timeOnDuty.n ? ` (${st.timeOnDuty.n})` : ''}`)}
      ${tile(d(st.timeOnDuty.max), 'Longest time on duty')}
      ${tile(d(st.held.avg), `Average off duty in Toronto before the trip home${st.held.n ? ` (${st.held.n})` : ''}`)}
      ${tile(st.held.over14, 'Held 14 h or more in Toronto', st.held.over14 > 0)}</div>
    <div class="strip">
      ${tile(d(st.offPlan.avg), `Average off, first plan vs on duty${st.offPlan.n ? ` (${st.offPlan.late} late, ${st.offPlan.early} early)` : ''}`)}
      ${tile(d(st.offOrder.avg), 'Average off, first order vs on duty')}
      ${tile(st.orderChanged, 'Order time changed after ordering')}
      ${tile(pct(st.pred.co), `Conductor predicted right${st.pred.en.n ? ` · engineer ${pctOf(st.pred.en)}%` : ''}`)}</div>`;
}
// A "most often" list; `q` makes each name a button that searches it.
// All deadheads are one line, "DH" (owner, 2026-10-26).
const numLabel = (n) => (n === 'DH' ? 'Deadheads (all)' : n);
function anaList(title, rows, q) {
  if (!rows.length) return `<div><h3>${esc(title)}</h3><p class="empty" style="padding:0">None yet.</p></div>`;
  return `<div><h3>${esc(title)}</h3><ul class="alist">${rows.map(([name, n]) => `<li>${q && !BoardTurns.PLACEHOLDER.test(name) ? `<button type="button" data-q="${esc(name)}" data-kind="${q}">${esc(q === 'train' ? numLabel(name) : name)}</button>` : `<span>${esc(name)}</span>`}<b>${n}</b></li>`).join('')}</ul></div>`;
}
// The flags on these trains (F1), as the Order summary names them.
function anaFlags(st) {

}
function anaWeek(st) {

}

// A column chart: one series in the accent colour, a hairline grid, each
// column tappable for its value (one tooltip, wired in renderAnalytics) and
// the same numbers as a table underneath. items: [{ label, value, tip }].
// every: label every Nth column. max: a fixed top (100 for percentages).
function niceMax(v) {
  if (v <= 1) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  return [1, 2, 5, 10].map((m) => m * p).find((m) => m >= v);
}
function colChart(title, items, { max = null, every = 1, unit = '', note = '' } = {}) {
  if (!items.length) return '';
  const top = max || niceMax(Math.max(...items.map((x) => x.value)));
  const ticks = [top, top / 2].filter((v) => Number.isInteger(v));
  const grid = ticks.map((v) => `<div class="cgl" style="bottom:${(100 * v) / top}%"><span>${v}${unit}</span></div>`).join('');
  const bars = items.map((x) => `<div class="cbar" tabindex="0" role="img" data-tip="${esc(x.tip)}" aria-label="${esc(x.tip)}"><i style="height:${(100 * x.value) / top}%"></i></div>`).join('');
  const labels = items.map((x, i) => `<span>${i % every === 0 ? esc(x.label) : ''}</span>`).join('');
  return `<div class="chart"><h3>${esc(title)}${note ? ` <span class="muted">${esc(note)}</span>` : ''}</h3>
    <div class="cplot">${grid}<div class="cbars">${bars}</div></div><div class="cx">${labels}</div>
    <details class="ctable"><summary>Show as a table</summary><table><tbody>${items.map((x) => `<tr><td>${esc(x.tip)}</td></tr>`).join('')}</tbody></table></details></div>`;
}
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
const weekLabel = (day) => when(day + ' 0000').day.replace(/^\w+, /, '');
function hourChart(runs) {
  const h = BoardAnalytics.byHour(runs);
  const p2 = (n) => String(n).padStart(2, '0');
  return colChart('On duty by hour of day', h.map((n, i) => ({ label: p2(i), value: n, tip: `${p2(i)}00–${p2(i)}59: ${plural(n, 'train')}` })), { every: 3 });
}
function weekChart(runs) {
  const w = BoardAnalytics.byWeek(runs);
  return colChart('Trains on duty per week', w.map((x) => ({ label: weekLabel(x.week), value: x.n, tip: `Week of ${weekLabel(x.week)}: ${plural(x.n, 'train')}` })), { every: Math.max(1, Math.ceil(w.length / 6)), note: '(weeks start Sunday)' });
}
// F6: held 14 h+ in Toronto, week by week (over the same weeks).
function heldWeekChart(runs) {
  if (!runs.some((r) => r.heldMin >= BoardTrains.HELD_LIMIT)) return '';
  const w = BoardAnalytics.byWeek(runs, (r) => (r.heldMin >= BoardTrains.HELD_LIMIT ? 1 : 0));
  return colChart('Held 14 h or more in Toronto, per week', w.map((x) => ({ label: weekLabel(x.week), value: x.n, tip: `Week of ${weekLabel(x.week)}: held 14 h+ ${x.n} time${x.n === 1 ? '' : 's'}` })), { every: Math.max(1, Math.ceil(w.length / 6)) });
}
const anaCharts = (runs) => `<section class="sheet"><header><h2>When</h2><span class="meta">tap a column for its number</span></header><div class="agrid wide">${hourChart(runs)}${weekChart(runs)}${heldWeekChart(runs)}</div></section>`;

// Every run, newest first; a line-up train opens in the Order summary.
function anaTable(runs, kind) {
  const LIMIT = 300;
  const rows = runs.slice(0, LIMIT).map((r) => {
    const fl = r.flag ? `<span class="flagtxt">${esc(FLAG_TEXT[r.flag] || r.flag)}</span>` : '';
    const held = r.heldMin != null ? `${r.heldMin >= BoardTrains.HELD_LIMIT ? '<span class="bad">' : '<span>'}${esc(dur(r.heldMin))}${r.stillHeld ? ' so far' : ''}</span>` : '—';
    const crew = kind === 'train' ? r.crew : (r.partners || []).join(' · ');
    return `<tr class="row${r.key ? '' : ' nolink'}"${r.key ? ` data-key="${esc(r.key)}" data-day="${esc(r.day)}"` : ''}>
      <td class="num"><b>${r.at ? esc(dt(r.at)) : `<span class="muted">${r.gone ? 'off line-up' : 'not yet'}</span>`}</b>${r.at ? `<div class="crew">${esc(when(r.at).day.replace(/^\w+, /, ''))}</div>` : ''}</td>
      <td class="num"><b class="id">${esc(r.id)}</b>${r.yard ? ' <span class="chip">yard</span>' : ''}${r.deadhead ? ' <span class="chip">DH</span>' : ''}${r.from === 'mac' ? ' <span class="from">Toronto</span>' : ''}${r.as ? `<div class="crew">${esc(r.as)}</div>` : ''}${r.turn && kind === 'code' ? `<div class="crew">on ${esc(r.turn)}</div>` : ''}${fl}</td>
      <td class="num">${crew ? esc(crew) : '—'}</td>

      <td class="num">${r.timeOnDuty != null ? esc(dur(r.timeOnDuty)) : '—'}</td>

  }).join('');
  return `<section class="sheet"><header><h2>${kind === 'train' ? 'Every train' : 'Every train worked'}</h2><span class="meta">${runs.length > LIMIT ? `newest ${LIMIT} of ${runs.length} · ` : ''}tap a line-up train for its full story</span></header>
    <div class="scroll"><table class="orders"><thead><tr><th>On duty</th><th>Train</th><th>${kind === 'train' ? 'Crew' : 'Worked with'}</th><th>First plan vs on duty</th><th>Time on duty</th><th>Off duty in Toronto</th></tr></thead>
    <tbody>${rows}</tbody></table></div></section>`;
}
// The whole answer for one search. kind: 'train' | 'turn' | 'code'.
// extra: { between, spares, took } for a turn (spares/took left out for a person);
// { runarounds } for a train number.
function analyticsView(runs, kind, title, note, extra = {}) {
  if (!runs.length) return `<p class="anote"><b>${esc(title)}</b>${note ? ` · ${note}` : ''}</p><p class="empty">Nothing found for that in the saved checks and dates picked.</p>`;
  const st = BoardAnalytics.stats(runs);
  const span = st.first ? `${esc(dt(st.first))} to ${esc(dt(st.last))}` : '';
  const lists = kind === 'train'
    ? [anaList('Conductors, most often', st.conductors, 'turn'), anaList('Engineers, most often', st.engineers, 'turn'), anaList('Pools that took it', st.pools), anaWeek(st), anaFlags(st)]
    : [anaList('Trains worked most', st.numbers.filter(([n]) => /^(DH|\d{3})$/.test(n)), 'train'), anaList('Worked with most', st.partners, 'turn'), anaWeek(st)];
  // A2: time between trains (turn or person); went spare and runarounds (turn).
  const b = extra.between;
  const more = kind === 'train'
    ? (extra.shownWrong ? `<p class="anote">${plural(extra.shownWrong, 'run')} showed out of sequence; ${extra.runarounds} still wrong when ${extra.runarounds === 1 ? 'it' : 'they'} went (runarounds). See "Out of sequence" with nothing searched.</p>` : '')
    : `<div class="strip${extra.spares == null ? ' two' : ''}">${anaTile(durOr(b.avg), `Average time between trains${b.n ? ` (${b.n})` : ''}, on duty to next on duty`)}${anaTile(durOr(b.min), 'Shortest time between trains')}${
      extra.spares == null ? '' : anaTile(extra.spares, 'Times it went spare (B0, ** or its train going spare)') + anaTile(extra.took, 'Trains it took out of sequence')}</div>`;
  return `<p class="anote"><b>${esc(title)}</b>${span ? ` · on duty ${span}` : ''}${note ? ` · ${note}` : ''}</p>
    ${anaTiles(st, kind)}${more}${extra.sleep ? sleepSection(extra.sleep) : ''}${anaCharts(runs)}
    <section class="sheet"><header><h2>Breakdown</h2></header><div class="agrid">${lists.join('')}</div></section>
    ${anaTable(runs, kind)}`;
}

// Nothing searched: everything, in sections.
const ANA_SECS = [['trains', 'Trains'], ['turns', 'Turns side by side'], ['sleep', 'Sleep'], ['runarounds', 'Out of sequence'], ['spare', 'Jobs going spare'], ['pred', 'Predictions']];

function anaTrains({ runs }) {

  const num = (n) => `<button type="button" class="qbtn" data-q="${esc(n)}" data-kind="train">${esc(numLabel(n))}</button>`;
  // A8: least reliable trains (2 or more with a plan to compare).

      <td class="num">${num(g.number)}</td><td class="num">${g.ran}</td><td class="num">${g.planN}</td><td class="num">${durOr(g.planAvg)}</td><td>${offCell(g.planWorst)}</td><td class="num">${g.late} · ${g.early}</td></tr>`).join('')}</tbody></table></div>`
    : '<p class="empty">Not enough trains with a plan to compare yet.</p>';

    : '<p class="empty">Every train seen went on duty.</p>';

    ${anaTiles(st, 'train')}${anaCharts(runs)}
    <section class="sheet"><header><h2>Breakdown</h2><span class="meta">tap a train number or turn to look it up</span></header><div class="agrid">
      ${anaList('Trains that ran most', st.numbers, 'train')}${anaList('Conductors, most trains', st.conductors, 'turn')}${anaList('Pools that took them', st.pools)}${anaWeek(st)}${anaFlags(st)}</div></section>

// A3: every turn in a pool, side by side.

      <td class="num stick"><button type="button" class="qbtn" data-q="${esc(r.turn)}" data-kind="turn">${esc(r.turn)}</button></td><td class="num"><b>${r.trains}</b></td><td class="num hide-sm">${r.yard}</td><td class="num hide-sm">${r.todTotal ? esc(dur(r.todTotal)) : '—'}</td><td class="num">${durOr(r.todAvg)}</td>

// A4 + owner 2026-10-26 ("ordered for A but the sequence says B": track
// the times it's showing wrong, then the actual crew on the train): every
// train shown out of sequence, each stretch of checks it showed wrong, the
// crew the Call Board shows went, and whether it was still wrong at the end
// (a runaround) or put right (fixed).
const poolName = (p) => esc(BoardAnalytics.SEQ_POOLS[p] || p || '—');
function seqResult(r) {
  if (r.fixed) return `<span class="offv ok">Fixed</span><div class="crew">then ${poolName(r.final && r.final.actual)}, as the sequence said</div>`;
  if (!r.onDuty) return '<span class="offv warn">Still wrong</span><div class="crew">not on duty yet</div>';
  return '<span class="offv bad">Runaround</span>';
}
function anaRunarounds({ runarounds }) {
  const st = BoardAnalytics.runaroundStats(runarounds);
  const latest = [...runarounds].reverse().slice(0, 60);
  const shown = (r) => {
    const sts = r.stretches || [];
    if (!sts.length) return stampBtn(r.taken);
    const first = sts[0];
    const last = sts[sts.length - 1];
    const range = `${stampBtn(first.from)}${last.to !== first.from ? ` – ${stampBtn(last.to)}` : ''}`;
    const detail = sts.length > 1 ? `<details><summary>${plural(sts.length, 'stretch', 'stretches')}</summary><ul class="moves">${sts.map((x) => `<li>${esc(dt(x.from))}${x.to !== x.from ? `–${esc(dt(x.to).split(' ')[1] || '')}` : ''}: ${esc(x.turn || '')} ${poolName(x.actual)}, sequence ${poolName(x.expected)} (${plural(x.checks, 'check')})</li>`).join('')}</ul></details>` : '';
    return `${range}<div class="crew">${plural(r.wrongChecks || sts.reduce((n, x) => n + x.checks, 0), 'check')}</div>${detail}`;
  };
  const list = latest.length ? `<div class="scroll"><table class="orders"><thead><tr><th class="stick">Train</th><th>Showed wrong</th><th>Showed it for</th><th>Sequence said</th><th>Crew that went</th><th>Result</th></tr></thead><tbody>${latest.map((r) => `<tr class="nolink">
      <td class="num stick"><b>${esc(r.train)}</b>${r.order ? `<div class="crew">ord ${esc(r.order)}</div>` : ''}</td>
      <td class="num">${shown(r)}</td>
      <td>${poolName(r.actual)}${r.turn ? ` <button type="button" class="qbtn" data-q="${esc(r.turn)}" data-kind="turn">${esc(r.turn)}</button>` : ''}</td>
      <td>${poolName(r.expected)}</td>
      <td class="num">${r.onDuty ? `${esc(r.crew || '—')}<div class="crew">on duty ${esc(dt(r.onDuty))}</div>` : '<span class="muted">not on duty yet</span>'}</td>
      <td>${seqResult(r)}</td></tr>`).join('')}</tbody></table></div>`
    : '<p class="empty">No trains out of sequence in the dates picked.</p>';
  return `<p class="anote">Every train the board showed out of sequence (the "To check" line: "ordered for A but the sequence says B", or a train that went to another pool). Each check it showed wrong is kept, then the crew the Call Board shows went. <b>Runaround</b>: still out of sequence the last time it showed. <b>Fixed</b>: put right before it went. Tap a time to open that snapshot.</p>
    <div class="strip">${anaTile(st.shown, 'Trains shown out of sequence')}${anaTile(st.n, 'Runarounds (still wrong at the end)', st.n > 0)}${anaTile(st.fixed, 'Fixed before they went')}${anaTile(durOr(st.wrongFor), 'Average time shown wrong')}</div>
    <section class="sheet"><header><h2>Runarounds by pool and turn</h2></header><div class="agrid">${anaList('The sequence said', st.shouldHave)}${anaList('Went to', st.wentTo)}${anaList('Turns that took them', st.tookIt, 'turn')}</div></section>
    <section class="sheet"><header><h2>Every train shown out of sequence</h2><span class="meta">newest first</span></header>${list}</section>`;
}
// A5: jobs going spare and who filled them.
function anaSpare({ spareJobs }) {
  const st = BoardAnalytics.spareJobStats(spareJobs);
  const chart = colChart('Jobs going spare per day', st.perDay.map((x) => ({ label: weekLabel(x.day), value: x.n, tip: `${weekLabel(x.day)}: ${plural(x.n, 'job')}` })), { every: Math.max(1, Math.ceil(st.perDay.length / 6)) });
  const latest = [...spareJobs].reverse().slice(0, 40);
  const list = latest.length ? `<div class="scroll"><table class="orders"><thead><tr><th>First listed</th><th>Job</th><th>Pool</th><th>Turn</th><th>Expected to fill</th><th>Filled by</th></tr></thead><tbody>${latest.map((j) => `<tr class="nolink">
      <td class="num">${stampBtn(j.first)}</td><td class="num"><b>${esc(j.train)}</b>${j.yard ? ' <span class="chip">yard</span>' : ''}</td><td>${esc(`${j.pool || ''} ${j.cc || ''}`.trim())}</td><td class="num">${esc(j.turn || '')}</td>
      <td class="num">${esc(j.predicted || '—')}</td><td class="num">${j.filledBy ? `<b>${esc(j.filledBy)}</b>${j.predicted ? (j.predicted === j.filledBy ? ' <span class="ok">✓</span>' : ' <span class="bad">✗</span>') : ''}` : '<span class="muted">not seen</span>'}</td></tr>`).join('')}</tbody></table></div>`
    : '<p class="empty">No jobs going spare in the dates picked.</p>';
  return `<p class="anote">Jobs on the vacancy list (option 5, yardmaster jobs left out). "Filled by" is the spare person seen on the Call Board working that job's turn; jobs filled where the board checker couldn't match a name show "not seen".</p>
    <div class="strip">${anaTile(st.n, 'Jobs going spare')}${anaTile(st.perDay.length ? (st.n / st.perDay.length).toFixed(1) : '—', 'Average per day (days with any)')}${anaTile(`${st.filled} <small>/ ${st.n}</small>`, 'Seen filled')}${anaTile(st.predicted.n ? `${pctOf(st.predicted)}% <small>${st.predicted.hit} / ${st.predicted.n}</small>` : '—', 'Expected spare turn was the one')}</div>
    <section class="sheet"><header><h2>Per day</h2><span class="meta">tap a column for its number</span></header><div class="agrid wide">${chart}</div></section>
    <section class="sheet"><header><h2>Breakdown</h2></header><div class="agrid">${anaList('Filled by, most often', st.filledBy, 'turn')}${anaList('Jobs by pool', st.byPool)}</div></section>
    <section class="sheet"><header><h2>Latest</h2><span class="meta">newest first</span></header>${list}</section>`;
}
// Sleep tracker (owner, 2026-10-26): once the expected call is 8 h away
// they go to sleep; then the call can move. How far the real call (on duty
// − 2 h) landed from the one they slept on: within 30 min green, within an
// hour yellow, more red.
function sleepCell(off) {
  const band = BoardAnalytics.sleepBand(off);
  if (!off) return '<span class="offv ok">on time</span>';
  return `<span class="offv ${band}">${esc(dur(off))} ${off < 0 ? 'earlier' : 'later'}</span>`;
}
const SLEEP_NOTE = 'They go to sleep once the expected call is 8 h away (the check where it first showed 8 h or less). The real call is on duty − 2 h. The gap is the time between the call they slept on and the real call: within 30 min green, within an hour yellow, more than that red. Taken off the line-up after going to sleep ends that wait (counted on its own); the next line-up starts a new one.';
function sleepTiles(st) {
  const pc = (n) => (st.n ? `${n} <small>${Math.round((100 * n) / st.n)}%</small>` : '—');
  return `<div class="strip">${anaTile(`<span class="offv ok">${pc(st.ok)}</span>`, 'Green: called within 30 min of what they slept on')}${anaTile(`<span class="offv warn">${pc(st.warn)}</span>`, 'Yellow: 30 min to 1 h off')}${anaTile(`<span class="offv bad">${pc(st.bad)}</span>`, 'Red: more than 1 h off', st.bad > 0)}${anaTile(durOr(st.avg), 'Average gap between the call they slept on and the real call (earlier or later)')}</div>
    <div class="strip">${anaTile(st.earlier, 'Called more than 30 min earlier than they slept on', st.earlier > 0)}${anaTile(durOr(st.earlierAvg), `When called earlier: average gap${st.earlierAll ? ` (${st.earlierAll} calls)` : ''}`)}${anaTile(st.later, 'Called more than 30 min later than they slept on')}${anaTile(durOr(st.laterAvg), `When called later: average gap${st.laterAll ? ` (${st.laterAll} calls)` : ''}`)}</div>
    <div class="strip three">${anaTile(st.shifts == null ? '—' : st.shifts.toFixed(1), 'Times the expected call moved after they went to sleep (average)')}${anaTile(st.short, 'Short notice: lined up under 8 h before the call')}${anaTile(st.takenOff, 'Taken off the line-up after going to sleep (not in the gaps above)', st.takenOff > 0)}</div>`;
}
// Each call, newest first, with every move of the expected call after they went to sleep.
function sleepTable(list, showTurn) {
  if (!list.length) return '<p class="empty">No calls tracked in the dates picked yet. A call counts once the turn was on a line-up (or expected to fill a job going spare) before it went on duty.</p>';
  const rows = [...list].reverse().slice(0, 200).map((z) => {
    const moves = (z.shifts || []).map((x) => `<li>${esc(dt(x.taken))}: call ${esc(dt(x.call))}${x.train !== z.expectedTrain ? ` (${esc(x.train)})` : ''}</li>`).join('');

      <div class="stat"><div class="v">${pct(acc.wco)} <small>${acc.wco.hit} / ${acc.wco.n}</small></div><div class="l">Conductor right, last 7 days</div></div>

    <section class="sheet"><header><h2>Trains · ${esc(w.day)}</h2><span class="meta">tap a train for its full story</span></header>

      <tbody>${body}</tbody></table></div>
      <div class="foot">A train belongs to the day it went on duty (or is due). "Off" compares the first planned or first ordered time on the line-up (41) with the on-duty time on the Call Board (6), as CATS shows them. First seen, ordered and changes are as of the check that saw them, so they're as exact as the time between checks. Off from plan / order colours, early or late alike: green under 30 m, <span class="chg">yellow</span> 30 m to 1 h 56 m, <span class="bad">red</span> beyond. Off duty in Toronto = the crew's bunkhouse rest − 8 h; n/a for L501/L502 and trains that start in Toronto. Toronto trains that leave the line-up and aren't on the Call Board ${BoardTrains.FLAG_WAIT} minutes later are flagged: <span class="bad">red</span> when no rested Sarnia crew was in the bunkhouse, <span class="chg">yellow</span> when one was.</div>

// A link straight to a turn or a train (owner, 2026-10-22): #turn=SR07,
// #train=M38261-22. The phone's share sheet when there is one, else copied.
async function shareLink(hash, title, button) {
  const url = `${location.origin}${location.pathname}${hash}`;
  try {
    if (navigator.share) { await navigator.share({ title, url }); return; }
    await navigator.clipboard.writeText(url);
    if (button) { const was = button.textContent; button.textContent = '✓ Link copied'; setTimeout(() => { button.textContent = was; }, 2000); }
  } catch (e) { /* cancelled */ }
}

// "When does this turn go?" from the newest check (data/whengo.json).
const whenGo = () => fetch('data/whengo.json', { cache: 'no-cache' }).then((r) => (r.ok ? r.json() : null)).catch(() => null);

// Hidden search by person (owner, 2026-10-24): a 4-letter code from a
// name (Justin O'Dea → JUOD) instead of a turn. Never suggested, never
// shown back as a name: the site only has hashes of codes with the turns
// each person was seen on (data/people.json, lib/board/people.js). What's
// typed is hashed here the same way and looked up.
const isCode = (t) => /^[A-Z]{4}$/.test(t || '');
const Person = (() => {
  const SALT = '240ca-person:';
  const PICK_KEY = 'personPick';
  const candidates = (list) => {
    const last = list.reduce((m, e) => (e.to > m ? e.to : m), '');
    return [...new Set(list.filter((e) => e.own && stampMin(last) - stampMin(e.to) <= 60).map((e) => e.turn))];
  };
  let data = null;
  // A failed fetch (phone signal) isn't kept: the next paint tries again.
  const load = () => data || (data = fetch('data/people.json', { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((d) => d.people || {}).catch(() => { data = null; return {}; }));
  async function hash(code) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(SALT + code.toUpperCase()));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
  }
  return {
    // The turns that person was seen on: [{ turn, own, from, to }], or null.
    async find(code) {
      if (!isCode(code) || !window.crypto || !crypto.subtle) return null;
      const [all, h] = await Promise.all([load(), hash(code)]);
      return all[h] && all[h].length ? all[h] : null;
    },
    hash,
    // The site published newer checks: read people.json again next time.
    reset() { data = null; },
    // A followed person ('@' + hash) → the turns they were seen on, or null.
    async byHash(h) {
      const all = await load();
      const list = all[String(h).replace(/^@/, '')];
      return list && list.length ? list : null;
    },
    // Where they were last seen: their own turn first. pick: the turn this
    // phone picked when the code matched more than one (option B below).
    current(list, pick) {
      if (pick && candidates(list).includes(pick)) return list.filter((e) => e.own && e.turn === pick).sort((a, b) => (a.to < b.to ? 1 : -1))[0];
      const last = list.reduce((m, e) => (e.to > m ? e.to : m), '');
      const now = list.filter((e) => e.to === last);
      return now.find((e) => e.own) || now[0] || null;
    },
    // Option B (owner, 2026-10-26): a code can match more than one own turn
    // at once (two people with the same letters, or a day of shuffling). The
    // own turns seen within an hour of the latest sighting; more than one and
    // the page asks which is theirs, kept on this phone.
    candidates: (list) => candidates(list),
    pickOf(h) { try { return (JSON.parse(localStorage.getItem(PICK_KEY)) || {})[String(h).replace(/^@/, '')] || ''; } catch (e) { return ''; } },
    setPick(h, turn) {
      try { const all = JSON.parse(localStorage.getItem(PICK_KEY)) || {}; all[String(h).replace(/^@/, '')] = turn; localStorage.setItem(PICK_KEY, JSON.stringify(all)); } catch (e) { /* not kept */ }
    },
  };
})();

// Turn alerts (owner, 2026-10-22): "Get alerts" on a turn subscribes this
// phone (web push, no app) and tells the site which turns it wants
// (push/subscribe, kept by the Worker). The board checker sends an alert when
// that turn is lined up, ordered, its call moves 30 min or more, or it goes
// on duty. The turns chosen are kept on this phone too, to show the buttons.
const Alerts = (() => {
  const KEY = 'alertTurns';
  const PREFS_KEY = 'alertPrefs';
  // What each turn's alerts cover on this phone (owner: e.g. only when it's
  // ordered, or only when the time moves by a chosen amount). time: minutes, 0 = never.
  const DEFAULT = { lineup: true, ordered: true, onDuty: true, aheadRest: true, aheadBack: true, reset: true, position: true, rescue: true, mayCall: true, time: 30, before: 0 };
  const supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  let key = null; // the board checker's public key (data/push.json); none = alerts off
  const ready = fetch('data/push.json', { cache: 'no-cache' }).then((r) => (r.ok ? r.json() : null)).then((d) => { key = d && d.publicKey; }).catch(() => {});
  const turns = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
  const keep = (list) => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch { /* not kept */ } };
  const allPrefs = () => { try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch { return {}; } };
  const prefs = (turn) => ({ ...DEFAULT, ...(allPrefs()[turn] || {}) });
  const keepPrefs = (turn, p) => { try { localStorage.setItem(PREFS_KEY, JSON.stringify({ ...allPrefs(), [turn]: p })); } catch { /* not kept */ } };
  const bytes = (b64u) => Uint8Array.from(atob(b64u.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - (b64u.length % 4)) % 4)), (c) => c.charCodeAt(0));
  async function save(list) {
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: bytes(key) });
    const res = await fetch('push/subscribe', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ subscription: sub.toJSON(), turns: list, prefs: Object.fromEntries(list.map((t) => [t, prefs(t)])) }) });
    if (!res.ok) throw new Error(`the site answered ${res.status}`);
    const out = await res.json();
    keep(out.turns || []);
    return out.turns || [];
  }
  return {
    ready,
    // 'on' | 'off' | 'unsupported' | 'ios-home' | 'none' (alerts not set up on this site)
    state(turn) {
      if (!key) return 'none';
      if (ios && !standalone) return 'ios-home';
      if (!supported) return 'unsupported';
      return turns().includes(turn) ? 'on' : 'off';
    },
    turns,
    prefs,
    // Changes what this turn's alerts cover; sent straight away if it's on.
    async setPrefs(turn, p) {
      keepPrefs(turn, { ...prefs(turn), ...p });
      if (turns().includes(turn)) await save(turns());
    },
    // Keeps this turn's choices on the phone without sending them.
    keepPrefs(turn, p) { keepPrefs(turn, { ...prefs(turn), ...p }); },
    async set(turn, on) {
      const now = turns();
      if (!on) return now.includes(turn) ? save(now.filter((t) => t !== turn)) : now;
      // Ask first, straight from the tap: iPhones only allow it there.
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') throw new Error('alerts are blocked for this site; allow notifications for it in the phone\'s settings');
      return save(now.includes(turn) ? now : [...now, turn]);
    },
  };
})();

// What this device remembers for the letters (owner, 2026-10-21): the names
// passcode, and each person's PIN and Mr./Ms. once a letter's been made.
// Only ever in this browser; a private window just starts empty.
const local = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* not kept */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* nothing to drop */ } },
};
const PASS_KEY = 'board-names-pass';
const PEOPLE_KEY = 'grievance-people'; // { byName: { "MIKE DE MAN": { pin, gender, initials } }, byTurn: { SR05: "Mike de Man" } }
const people = () => ({ byName: {}, byTurn: {}, ...(local.get(PEOPLE_KEY) || {}) });
function remember(turn, d, initials) {
  if (!d.name) return;
  const p = people();
  p.byName[d.name.toUpperCase()] = { pin: d.pin, gender: d.gender, initials };
  if (turn) p.byTurn[turn] = d.name;
  local.set(PEOPLE_KEY, p);
}
// Filled-in form values for a row: names from CATS (unlocked) first, else
// the name last used for that turn on this device; PIN and Mr./Ms. from what
// this device remembers for that name.
function prefill(r, names) {
  const n = (names && names[heldKey(r)]) || {};
  const p = people();
  const name = n.co || p.byTurn[r.co] || '';
  const known = p.byName[name.toUpperCase()] || {};
  return { name, engineer: n.en || '', pin: known.pin || '', gender: known.gender || 'male', initials: known.initials || '', fromCats: !!n.co, turnOnly: !!n.turnOnly };
}
